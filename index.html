        </div>
        ${S.me.isAdmin ? `<div class="section"><h4>Исполнитель</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><select class="input" id="reassign">${S.team.map(u => `<option value="${esc(u.login)}" ${k.assignee === u.login ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
          <option value="" ${!k.assignee ? 'selected' : ''}>— без исполнителя —</option></select>
          <button class="btn" data-act="reassign">Назначить</button></div></div>` : ''}
        <div class="kbd-hint"><span><kbd>←</kbd> <kbd>→</kbd> соседние виды</span><span><kbd>Esc</kbd> закрыть</span></div>`;
    } else if (tab === 'docs') {
      body = docs.length ? `<div class="table-wrap"><table class="t"><thead><tr><th class="nosort">Документ</th><th class="nosort">Статус</th><th class="nosort">Прогон</th><th class="nosort num">Время</th><th class="nosort num">Ошибок</th></tr></thead>
        <tbody>${docs.map(d => `<tr style="cursor:default">
          <td style="font-size:12px">${docLabel(d)}</td>
          <td>${pill(d.st.last ? d.st.status : (d.guid ? 'pending' : 'noinstance'))}${d.st.fix === 'deployed' ? '<div class="sub-line" style="color:var(--rev)">исправлено — перепрогнать</div>' : d.st.fix === 'pending' ? '<div class="sub-line" style="color:var(--int)">ждёт выкладки</div>' : ''}</td>
          <td class="nowrap muted">${d.st.lastRunAt ? fmtDT(d.st.lastRunAt) : '—'}</td>
          <td class="num">${fmtSec(d.st.sec)}</td>
          <td class="num">${d.st.errors ? `<span class="errn">${d.st.errors}</span>` : d.st.fin ? '0' : '—'}${d.st.ignored ? ` <span class="faint" title="из них в алгоритмах «не трогать»">(${d.st.ignored} не тр.)</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`
        : '<div class="empty"><div class="ico">📄</div>Нет документов</div>';
    } else if (tab === 'errors') {
      body = errDocs.length ? errDocs.map(d => { const r = finOf(d); return `<div class="doc-h">${docLabel(d)} <span class="faint">${fmtDT(r.startAt, true)}</span></div>${(r.errors || []).filter(e => !isSrvErr(e, r)).map(e => errBox(e, r)).join('')}${srvBlock(r)}`; }).join('')
        : '<div class="empty"><div class="ico">✅</div>Ошибок в последних прогонах нет</div>';
    } else if (tab === 'algs') {
      body = `${algRun && algRun !== lastFin ? '<div class="faint" style="margin-bottom:8px;font-size:12.5px">по документу этапа 2</div>' : ''}<div class="table-wrap"><table class="t"><thead><tr><th class="nosort">Алгоритм</th><th class="nosort num">Запусков</th><th class="nosort num">Время</th><th class="nosort" style="width:130px"></th><th class="nosort num">Макс.</th></tr></thead>
        <tbody>${algs.map(a => { const vi = verInfo(a.name); return `<tr style="cursor:default">
          <td class="mono">${a.failed ? (ignored(a.name) ? '<span class="faint" title="ошибка (не трогать)">✗</span>' : '<span style="color:var(--err)" title="ошибка">✗</span>') : a.ran ? '<span style="color:var(--ok)">✓</span>' : '<span class="faint" title="не запускался">·</span>'} ${esc(a.name)}${LogParser.isLink(S.links, a.name) ? ' <span class="faint">(связи)</span>' : a.inKind ? '' : ' <span class="faint">(общий)</span>'}
            ${a.ran && a.maxSec >= SLOW_SEC ? ' <span class="pill fixp small">медленный</span>' : ''}${ignored(a.name) ? ' <span class="pill ign small">не трогать</span>' : ''}${(() => {
              const rv = algRun && algRun.algVers ? algRun.algVers[a.name] : null;   // версия в этом прогоне (метка [PKTS-VER])
              const newer = vi && (verNum(rv) == null ? vi.available > 1 : vi.available > verNum(rv));
              return (rv ? ` <span class="pill plain small" title="версия в этом прогоне">${esc(rv)}</span>` : '')
                + (newer ? ` <span class="pill ${vi.pending ? 'fixp' : 'fixd'} small" title="${esc(vi.notes)}">доступна ${verLabel(vi.available)}${vi.pending ? ', ждёт выкладки' : ''}</span>` : '');
            })()}</td>
          <td class="num">${a.ran ? a.count : '—'}</td><td class="num">${a.ran ? fmtSec(a.totalSec) : '—'}</td>
          <td>${a.ran ? `<div class="alg-bar ${a.failed && !ignored(a.name) ? 'f' : ''}" style="width:${Math.max(2, (a.totalSec / maxAlg) * 100)}%"></div>` : ''}</td>
          <td class="num">${a.ran ? fmtSec(a.maxSec) : '—'}</td></tr>`; }).join('')}</tbody></table></div>`;
    } else {
      body = runs.length ? `<div class="timeline">${runs.map(r => {
        const u = up.get(r.uploadId) || {};
        const ee = effErrors({ ...r, errAlgs: r.errAlgs || (r.errors || []).map(e => e.alg || '') });
        const nsrv = (r.srvProblems || []).length;
        const stc = r.finished ? (ee.eff ? 'errors' : nsrv ? 'server' : 'ok') : 'interrupted';
        const st2 = r.guid && (r.guid !== k.guid || (r.ps && r.ps !== (k.ps || '')));
        return `<div class="tl ${stc}"><div class="h"><div><b>${fmtDT(r.startAt, true)}</b> · ${r.finished ? (ee.eff ? `с ошибками (${ee.eff})${nsrv ? `, серверных проблем: ${nsrv}` : ''}` : nsrv ? `серверные проблемы (${nsrv})` : 'выполнен') : 'прерван'}${r.total ? ` <span class="faint">· документ ${r.idx} из ${r.total}</span>` : ''}${st2 ? ` <span class="stage-chip">этап 2</span> <span class="faint mono" style="font-size:11.5px">${esc(shortGuid(r.guid))}${r.ps ? ' · ' + esc(psLabel(r.ps)) : ''}</span>` : ''}</div><div class="nowrap"><b>${fmtSec(docSec(r))}</b></div></div>
          <div class="faint" style="font-size:12.5px">${esc(u.fileName || '')} · загрузил(а) ${esc(userName(u.by))} ${ago(u.at)}${r.match === 'auto' ? ' · вид определён по алгоритмам' : r.match === 'manual' || r.match === 'hint' ? ' · вид указан вручную' : ''}</div></div>`;
      }).join('')}</div>` : '<div class="empty"><div class="ico">⏳</div>Прогонов ещё не было</div>';
    }
    ov.innerHTML = `<div class="backdrop" data-act="closeDrawer"></div>
    <aside class="drawer" role="dialog" aria-label="Вид ${esc(k.code)}">
      <div class="drawer-head">
        <div class="row1"><span class="code">${esc(k.code)}</span>${pill(v.status || k.status)}${stage === 2 ? ` <span class="stage-chip">этап 2 · ${k.s2.done}/${k.s2.total}</span>` : ''}
          ${rv.st === 'ok' ? `<span class="pill rev">${I.check}Проверено</span>` : rv.st === 'issue' ? `<span class="pill issue">${I.flag}Замечание</span>` : ''}
          <div class="drawer-nav">
            ${pos >= 0 ? `<button class="btn ghost icon" data-act="prev" title="Предыдущий (←)" ${pos <= 0 ? 'disabled' : ''}>${I.left}</button>
              <span class="pos">${pos + 1} / ${S.nav.length}</span>
              <button class="btn ghost icon" data-act="next" title="Следующий (→)" ${pos >= S.nav.length - 1 ? 'disabled' : ''}>${I.right}</button>` : ''}
            <button class="btn ghost icon close-x" data-act="closeDrawer" title="Закрыть (Esc)">${I.x}</button>
          </div></div>
        <h2>${esc(k.name) || '<span class="faint">без наименования</span>'}</h2>
        <div style="display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px">
          <span>${typeRu(k.doctype, k.category)}</span><span>${who(k.assignee)}</span><span>${k.algCount} ${plural(k.algCount, 'алгоритм', 'алгоритма', 'алгоритмов')}${k.linkAlgs && k.linkAlgs.length ? ` + связи` : ''}</span>
          ${k.guid ? `<span class="copy mono" data-act="copy" data-text="${esc(k.guid)}" title="Скопировать GUID">${esc(k.guid)}</span>` : '<span class="faint">нет экземпляра документа</span>'}
        </div>
        <div class="tabs">${tb('overview', 'Обзор')}${k.docs2.length ? tb('docs', 'Документы', docs.length) : ''}${tb('errors', 'Ошибки', errTotal, true)}${tb('algs', 'Алгоритмы', algs.length)}${tb('history', 'История', runs.length)}</div>
      </div>
      <div class="drawer-body">${body}</div>
    </aside>`;
    bindDrops();
  }

  function navKind(delta) {
    const pos = S.nav.indexOf(S.kindOpen);
    const nxt = S.nav[pos + delta];
    if (nxt) go(S.route, nxt);
  }

  // =====================================================================================================================
  // загрузка протоколов (разбор в браузере)
  function pickFiles(hint) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.multiple = true; inp.accept = '.txt,.log,text/plain';
    inp.onchange = () => { if (inp.files.length) processFiles([...inp.files], hint || ''); };
    inp.click();
  }

  function bindDrops() {
    $$('.drop').forEach(z => {
      if (z.dataset.bound) return;
      z.dataset.bound = '1';
      const inp = $('input[type=file]', z);
      z.onclick = () => inp.click();
      inp.onclick = e => e.stopPropagation();
      inp.onchange = () => { if (inp.files.length) processFiles([...inp.files], z.dataset.drop); inp.value = ''; };
      z.ondragover = e => { e.preventDefault(); z.classList.add('over'); };
      z.ondragleave = () => z.classList.remove('over');
      z.ondrop = e => { e.preventDefault(); e.stopPropagation(); z.classList.remove('over'); hideDropOverlay(); if (e.dataTransfer.files.length) processFiles([...e.dataTransfer.files], z.dataset.drop); };
    });
  }

  // перетаскивание файла в любое место окна
  let dragDepth = 0;
  const isFileDrag = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  function showDropOverlay() {
    if ($('.drop-overlay') || !S.me || isObserver()) return;
    const d = document.createElement('div');
    d.className = 'drop-overlay';
    d.innerHTML = `<div class="box">${I.upload}<b>Отпустите — протоколы будут разобраны</b><div class="muted">выполненные документы отметятся автоматически</div></div>`;
    document.body.appendChild(d);
  }
  function hideDropOverlay() { dragDepth = 0; $$('.drop-overlay').forEach(x => x.remove()); }
  window.addEventListener('dragenter', e => { if (!isFileDrag(e) || !S.me) return; dragDepth++; showDropOverlay(); });
  window.addEventListener('dragleave', e => { if (!isFileDrag(e)) return; if (--dragDepth <= 0) hideDropOverlay(); });
  window.addEventListener('dragover', e => { if (isFileDrag(e) && S.me) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!isFileDrag(e) || !S.me) return;
    e.preventDefault();
    hideDropOverlay();
    if (e.dataTransfer.files.length) processFiles([...e.dataTransfer.files], '');
  });

  function busy(text, frac) {
    let b = $('.busy');
    if (text == null) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.className = 'busy'; document.body.appendChild(b); }
    b.innerHTML = `<div><span class="spin"></span> ${esc(text)}</div><div class="progress"><div style="width:${Math.round((frac || 0) * 100)}%;background:linear-gradient(90deg,var(--accent),var(--accent-2))"></div></div>`;
  }

  // какой скачанный JSON был запущен: тот, у которого на позициях N/M протокола стоят те же GUID — из него берётся набор параметров
  async function matchBatches(docs) {
    const res = new Map();
    const totals = [...new Set(docs.filter(d => d.guid && d.total).map(d => d.total))];
    for (const t of totals) {
      const dt = docs.filter(d => d.guid && d.total === t);
      let cands = [];
      try { cands = await DB.findBatches(t); } catch { }
      const b = cands.find(c => dt.every(d => { const it = c.items[d.idx - 1]; return it && String(it[1]).toLowerCase() === d.guid; }));
      if (b) res.set(t, b);
    }
    return res;
  }

  async function processFiles(files, hint) {
    if (isObserver()) { toast('Наблюдатель не загружает протоколы', true); return; }
    if (S.uploading) { toast('Дождитесь окончания текущей загрузки'); return; }
    files = files.filter(f => f.size > 0);
    if (!files.length) return;
    S.uploading = true;
    const guidMap = new Map(S.kinds.filter(k => k.guid).map(k => [k.guid.toLowerCase(), k.code]));
    S.instances.forEach(x => { if (!guidMap.has(x.guid.toLowerCase())) guidMap.set(x.guid.toLowerCase(), x.kindCode); });
    const reports = [];
    try {
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        busy(`Разбор «${f.name}» (${i + 1} из ${files.length})…`, i / files.length);
        await new Promise(r => setTimeout(r, 20));
        const text = LogParser.decode(await f.arrayBuffer());
        const p = LogParser.parse(text, { shiftHours: LOG_SHIFT, links: S.links });
        const plans = await matchBatches(p.docs);
        let unknown = 0, unattributed = 0;
        const runs = p.docs.map((d, pos) => {
          const r = { ...d, pos, kindCode: null, match: null, candidates: [], ps: '', batchId: null };
          if (d.guid) {
            const plan = plans.get(d.total);
            if (plan) { const it = plan.items[d.idx - 1]; r.ps = (it && it[2]) || ''; r.batchId = plan.id; }
            const c = guidMap.get(d.guid);
            if (c) { r.kindCode = c; r.match = 'guid'; } else unknown++;
          } else if (hint) { r.kindCode = hint; r.match = 'hint'; }
          else {
            const m = LogParser.matchKind(S.kinds, d, S.links);
            r.candidates = m.candidates;
            if (m.code) { r.kindCode = m.code; r.match = 'auto'; } else unattributed++;
          }
          return r;
        });
        const effOf = r => effErrors({ errorCount: r.errors.length, errAlgs: r.errors.map(e => e.alg || '') }).eff;
        const fin = runs.filter(r => r.finished && r.kindCode).length;
        const err = runs.filter(r => r.finished && r.kindCode && effOf(r)).length;
        const intr = runs.filter(r => !r.finished && r.kindCode).length;
        const owners = {};
        runs.filter(r => r.kindCode).forEach(r => { const k = kindByCode(r.kindCode); const o = (k && k.assignee) || ''; owners[o] = (owners[o] || 0) + 1; });
        busy(`Сохранение «${f.name}»…`, (i + 0.6) / files.length);
        const id = await DB.saveUpload({
          fileName: f.name, by: S.me.login, size: f.size, operations: p.operations, batch: p.batch, summary: p.summary, logFrom: p.from, logTo: p.to,
        }, runs, text);
        const others = Object.keys(owners).filter(o => o && o !== S.me.login);
        await DB.addEvent({
          by: S.me.login, uploadId: id,
          text: `загрузил(а) протокол «${f.name}»: выполнено ${fin}, с ошибками ${err}, прервано ${intr}` + (unknown ? `, не из списка ${unknown}` : '') + (unattributed ? `, вид не определён ${unattributed}` : '')
            + (others.length ? ` (документы: ${Object.entries(owners).map(([o, n]) => `${o ? userName(o) : 'без исполнителя'} ${n}`).join(', ')})` : ''),
        });
        reports.push({
          id, fileName: f.name, batch: p.batch, summary: p.summary, docs: runs.length, finished: fin, withErrors: err, interrupted: intr, unknown, unattributed, owners,
          planned: runs.filter(r => r.batchId).length,
          running: [...new Set(runs.filter(r => !r.finished).flatMap(r => r.running))],
          kinds: [...new Set(runs.filter(r => r.kindCode).map(r => r.kindCode))],
        });
      }
    } catch (e) {
      console.error(e);
      toast('Ошибка загрузки: ' + e.message, true);
    } finally {
      S.uploading = false;
      busy(null);
    }
    S.algs = null;
    await safe(loadState);
    renderShell();
    renderPage();
    if (S.kindOpen) openKind(S.kindOpen);
    if (reports.length) showReport(reports);
  }

  function showReport(rep) {
    const st = pageStage('my');
    const mine = stats(myList(), st);
    const fin = rep.reduce((a, r) => a + r.finished, 0);
    modal('Протоколы разобраны', `
      <div class="big-ok">${donut(mine, 74, 9)}<div><b>${fin}</b> ${plural(fin, 'документ отмечен', 'документа отмечено', 'документов отмечено')} выполненными
        <div class="muted">У вас осталось ${mine.remaining} ${plural(mine.remaining, 'документ', 'документа', 'документов')}${st === 2 ? ' этапа 2' : ''}${mine.toReview ? `, ждут проверки — ${mine.toReview} ${plural(mine.toReview, 'вид', 'вида', 'видов')}` : ''}</div></div></div>
      ${rep.map(r => `<div class="report">
        <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b>${esc(r.fileName)}</b>
          <span class="muted">${r.batch ? 'пакетный запуск' : 'одиночный запуск'} · ${r.docs} ${plural(r.docs, 'документ', 'документа', 'документов')}</span></div>
        ${r.summary ? `<div class="faint" style="font-size:12.5px">Сводка сервера: ${esc(r.summary)}</div>` : ''}
        <div class="nums">
          <span class="pill ok"><i></i>выполнено ${r.finished}</span>
          ${r.withErrors ? `<span class="pill errors"><i></i>из них с ошибками ${r.withErrors}</span>` : ''}
          ${r.interrupted ? `<span class="pill interrupted"><i></i>прервано ${r.interrupted}</span>` : ''}
          ${r.unknown ? `<span class="pill pending"><i></i>не из списка видов ${r.unknown}</span>` : ''}
          ${r.unattributed ? `<span class="pill interrupted"><i></i>вид не определён ${r.unattributed}</span> <a href="#" data-act="openUpload" data-id="${r.id}">указать вручную →</a>` : ''}
        </div>
        ${Object.keys(r.owners).some(o => o !== S.me.login) ? `<div class="faint" style="font-size:12.5px;margin-top:8px">Отмечено у владельцев видов:</div>${ownersLine(r.owners)}` : ''}
        ${r.running.length ? `<div class="errbox warn" style="margin:10px 0 0"><div style="font-size:12.5px">Протокол оборвался во время: <span class="mono">${r.running.map(esc).join(', ')}</span></div></div>` : ''}
        ${!r.docs ? '<div class="muted" style="margin-top:8px">В файле не найдено ни одного документа — это точно протокол выполнения алгоритмов?</div>' : ''}
      </div>`).join('')}`,
      `<button class="btn" data-act="closeModal">Закрыть</button>
       ${mine.toReview ? `<button class="btn" data-act="startReview">${I.check}Проверять результаты (${mine.toReview})</button>` : ''}
       ${(() => { const nRE = remainingErrDocs(S.me.login, st).length; return `<button class="btn" data-act="dlRemainingErr" data-login="${esc(S.me.login)}" data-st="${st}" ${nRE ? '' : 'disabled'} title="Невыполненные и прерванные плюс все документы с ошибками">${I.dl}остаток + ошибочные (${nRE})</button>`; })()}
       <button class="btn primary" data-act="dlRemaining" data-login="${esc(S.me.login)}" data-st="${st}" ${mine.remaining ? '' : 'disabled'}>${I.dl}JSON остатка (${mine.remaining})</button>`);
  }

  async function openUpload(id) {
    const u = S.uploadsList.find(x => x.id === id);
    if (!u) return;
    const runs = await safe(() => DB.runsFull({ uploadId: id }));
    if (!runs) return;
    runs.sort((a, b) => a.pos - b.pos);
    const kname = c => (kindByCode(c) || {}).name || '';
    const owner = c => { const k = kindByCode(c); return k && k.assignee ? `<div class="sub-line">${esc(userName(k.assignee))}</div>` : ''; };
    modal(`Протокол №${u.id} · ${esc(u.fileName)}`, `
      <div class="meta-grid" style="margin-bottom:14px">
        <div class="mg"><div class="l">Загрузил(а)</div><div class="v">${esc(userName(u.by))}</div></div>
        <div class="mg"><div class="l">Когда</div><div class="v">${fmtDT(u.at, true)}</div></div>
        <div class="mg"><div class="l">Операция</div><div class="v" style="font-weight:600">${esc((u.operations || []).join(', ') || '—')}</div></div>
        ${u.summary ? `<div class="mg"><div class="l">Сводка сервера</div><div class="v" style="font-weight:600">${esc(u.summary)}</div></div>` : ''}
      </div>
      <datalist id="kindCodes">${S.kinds.map(k => `<option value="${esc(k.code)}">${esc(k.name)}</option>`).join('')}</datalist>
      <div class="table-wrap"><table class="t"><thead><tr><th class="nosort">№</th><th class="nosort">Документ</th><th class="nosort">Вид · чей</th><th class="nosort">Статус</th><th class="nosort num">Время</th><th class="nosort num">Ошибок</th></tr></thead>
      <tbody>${runs.map(r => { const ee = effErrors({ ...r, errAlgs: r.errAlgs || (r.errors || []).map(e => e.alg || '') }); return `<tr style="cursor:default">
        <td class="muted">${r.total ? r.idx : r.pos + 1}</td>
        <td class="mono" style="font-size:11.5px">${r.guid ? esc(r.guid) : '<span class="faint">без GUID</span>'}${r.ps ? ` <span class="pill plain small">${esc(psLabel(r.ps))}</span>` : ''}<div class="faint">${fmtDT(r.startAt)}</div></td>
        <td>${r.kindCode ? `<a href="#/${S.route}/k/${encodeURIComponent(r.kindCode)}">${esc(r.kindCode)}</a><div class="sub-line">${esc(kname(r.kindCode))}</div>${owner(r.kindCode)}
            ${!r.guid ? `<button class="btn small ghost" data-act="unattribute" data-run="${r.id}" data-upload="${u.id}">изменить</button>` : ''}`
        : r.guid ? '<span class="faint">не из списка видов</span>'
          : `<div style="display:flex;gap:6px;flex-wrap:wrap"><input class="input" list="kindCodes" placeholder="Код вида" style="width:180px" data-attr-input="${r.id}" value="${esc(r.candidates[0] || '')}">
            <button class="btn small primary" data-act="attribute" data-upload="${u.id}" data-run="${r.id}">Отнести</button></div>
            ${r.candidates.length ? `<div class="sub-line" style="max-width:360px">Похожие по алгоритмам: ${r.candidates.slice(0, 4).map(esc).join(', ')}</div>` : ''}`}</td>
        <td>${pill(r.finished ? (ee.eff ? 'errors' : (r.srvProblems || []).length ? 'server' : 'ok') : 'interrupted')}</td>
        <td class="num">${fmtSec(docSec(r))}</td><td class="num">${ee.eff ? `<span class="errn">${ee.eff}</span>` : 0}${ee.ign ? ` <span class="faint" title="из них в алгоритмах «не трогать»">(${ee.ign} не тр.)</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`,
      '<button class="btn" data-act="closeModal">Закрыть</button>');
  }

  // =====================================================================================================================
  // модальные окна
  function modal(title, body, foot) {
    closeModal();
    const ov = document.createElement('div');
    ov.className = 'modal-layer';
    ov.innerHTML = `<div class="backdrop" data-act="closeModal"></div><div class="modal" role="dialog">
      <div class="mh"><h3>${title}</h3><button class="btn ghost icon close-x" style="margin-left:auto" data-act="closeModal">${I.x}</button></div>
      <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
    document.body.appendChild(ov);
    return ov;
  }
  const closeModal = () => $$('.modal-layer').forEach(m => m.remove());

  async function afterChange(msg) {
    S.algs = null;
    await safe(loadState);
    renderShell();
    renderPage();
    if (S.kindOpen) await openKind(S.kindOpen);
    if (msg) toast(msg);
  }

  function startReview() {
    closeModal();
    S.f.my.status = 'unreviewed';
    S.f.my.q = '';
    S.tab = 'overview';
    location.hash = '#/my';
    setTimeout(() => {
      renderPage();
      if (S.nav.length) go('my', S.nav[0]); else toast('Нечего проверять');
    }, 0);
  }

  function algModal(a) {
    const m = algMode(a);
    const vi = m.v;
    modal(`<span class="mono" style="font-size:15px">${esc(a.name)}</span>`, `<div class="meta-grid" style="margin-bottom:14px">
        <div class="mg"><div class="l">Среднее</div><div class="v">${fmtSec(a.avgSec)}</div></div>
        <div class="mg"><div class="l">Максимум</div><div class="v">${fmtSec(a.maxSec)}</div></div>
        <div class="mg"><div class="l">Последний прогон</div><div class="v">${a.lastSec >= 0 ? fmtSec(a.lastSec) : '—'}</div></div>
        <div class="mg"><div class="l">Документов</div><div class="v">${a.docs}</div></div>
        <div class="mg"><div class="l">С ошибкой</div><div class="v" style="color:${a.failed && !m.ign ? 'var(--err)' : 'inherit'}">${a.failed}${m.ign ? ' · не трогать' : ''}</div></div></div>
      ${m.ign ? `<div class="errbox ign" style="margin-bottom:12px"><b>Не трогать</b> — отметка для разработчика: в выгрузку ошибок и медленных не попадает${S.flags.get(a.name).note ? ' · ' + esc(S.flags.get(a.name).note) : ''} <span class="faint">(${esc(userName(S.flags.get(a.name).by))}, ${fmtDT(S.flags.get(a.name).at)})</span></div>` : ''}
      ${m.slow ? `<div class="errbox warn" style="margin-bottom:12px"><b>Медленный</b> — максимум ${fmtSec(a.maxSec)}, последний прогон ${a.lastSec >= 0 ? fmtSec(a.lastSec) : '—'}: кандидат на оптимизацию</div>` : ''}
      ${vi ? `<div class="section" style="margin-top:0"><h4>Версии</h4>${(S.versions.get(a.name) || []).slice().reverse().map(v => `<div style="padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px">
          <b>${verLabel(v.version)}</b> · ${fmtDT(v.at, true)}${v.deployId ? ` · <span style="color:var(--rev)">выложено ${fmtDT((S.deployById.get(v.deployId) || {}).at, true)}</span>` : isDeployed(v) ? ' · <span style="color:var(--rev)">на сервере (по протоколу)</span>' : ' · <span style="color:var(--int)">ждёт выкладки</span>'}${v.note ? ` — ${esc(v.note)}` : ''}${v.commit ? ` <span class="faint mono">${esc(v.commit.slice(0, 8))}</span>` : ''}</div>`).join('')}</div>` : ''}
      <div class="section"><h4>Виды</h4>` +
      a.kinds.map(c => { const k = kindByCode(c); return `<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><div><a href="#/algs/k/${encodeURIComponent(c)}" class="mono">${esc(c)}</a> <span class="muted">${esc(k ? k.name : '')}</span></div>${k ? pill(k.status) : ''}</div>`; }).join('') + '</div>',
      '<button class="btn" data-act="closeModal">Закрыть</button>');
  }

  // =====================================================================================================================
  // обработчики
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-act]');
    const act = t && t.dataset.act;
    if (S.menu && act !== 'menu' && !e.target.closest('.menu')) { S.menu = false; renderShell(); }
    if (!act) {
      if (e.target.closest('[data-stop]')) return;
      const row = e.target.closest('tr[data-kind]');
      if (row) { S.tab = 'overview'; go(S.route, row.dataset.kind); return; }
      const ur = e.target.closest('tr[data-upload]');
      if (ur) { openUpload(+ur.dataset.upload); return; }
      const ar = e.target.closest('tr[data-alg]');
      if (ar && S.algs) { const a = S.algs.find(x => x.name === ar.dataset.alg); if (a) algModal(a); }
      return;
    }
    if (t.tagName === 'A') e.preventDefault();
    if (isObserver() && WRITE_ACTS.has(act)) { toast('Наблюдатель только просматривает — действия недоступны', true); return; }
    switch (act) {
      case 'theme': toggleTheme(); break;
      case 'menu': S.menu = !S.menu; renderShell(); break;
      case 'refresh': await afterChange('Данные обновлены'); break;
      case 'logout': await DB.signOut(); S.me = null; S.menu = false; location.hash = ''; renderLogin(); break;
      case 'csvAll': S.menu = false; renderShell(); exportCsv(null); break;
      case 'pickFiles': pickFiles(''); break;
      case 'startReview': startReview(); break;
      case 'pw': S.menu = false; renderShell(); modal('Сменить пароль', `
        <div class="grid" style="max-width:380px">
          <input class="input" type="password" id="pwOld" placeholder="Текущий пароль" autocomplete="current-password">
          <input class="input" type="password" id="pwNew" placeholder="Новый пароль (не короче 8 символов)" autocomplete="new-password">
          <input class="input" type="password" id="pwNew2" placeholder="Новый пароль ещё раз" autocomplete="new-password">
          <div id="pwErr" style="color:var(--err);min-height:20px"></div></div>`,
        '<button class="btn" data-act="closeModal">Отмена</button><button class="btn primary" data-act="pwSave">Сохранить</button>');
        $('#pwOld').focus();
        break;
      case 'pwSave': {
        const n = $('#pwNew').value;
        if (n.length < 8) { $('#pwErr').textContent = 'Новый пароль — не короче 8 символов'; break; }
        if (n !== $('#pwNew2').value) { $('#pwErr').textContent = 'Пароли не совпадают'; break; }
        try { await DB.changePassword(S.me, $('#pwOld').value, n); closeModal(); toast('Пароль изменён'); }
        catch (err) { $('#pwErr').textContent = err.message; }
        break;
      }
      case 'stage': {
        const st = +t.dataset.st;
        S.f[t.dataset.page].stage = st;
        S.f[t.dataset.page].status = 'all';
        renderShell();
        renderPage();
        break;
      }
      case 'status': {
        const f = S.f[t.dataset.page];
        f.status = t.classList.contains('stat-pill') && f.status === t.dataset.key ? 'all' : t.dataset.key;
        if (S.route === 'team') { S.f.all.who = 'all'; S.f.all.stage = 1; go('all'); break; }
        renderPage();
        if (t.classList.contains('stat-pill')) { const tb = $('#tbl'); if (tb) tb.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        break;
      }
      case 'sort': {
        const s = S.sort[t.dataset.page];
        if (s.key === t.dataset.key) s.dir = -s.dir;
        else { s.key = t.dataset.key; s.dir = ['lastRunAt', 'docSec', 'errors', 'algCount'].includes(s.key) ? -1 : 1; }
        refreshTable(t.dataset.page);
        break;
      }
      case 'asort': {
        const s = S.sort.algs;
        if (s.key === t.dataset.key) s.dir = -s.dir; else { s.key = t.dataset.key; s.dir = t.dataset.key === 'name' ? 1 : -1; }
        renderAlgs();
        break;
      }
      case 'amode': S.f.algs.mode = t.dataset.key; renderAlgs(); break;
      case 'asel': if (t.checked) S.algSel.add(t.dataset.name); else S.algSel.delete(t.dataset.name); renderAlgs(); break;
      case 'aselAll': {
        const rows = $$('#algs tbody tr[data-alg]').map(tr => tr.dataset.alg);
        rows.forEach(n => t.checked ? S.algSel.add(n) : S.algSel.delete(n));
        renderAlgs();
        break;
      }
      case 'aselClear': S.algSel.clear(); renderAlgs(); break;
      case 'aflag': {
        if (!isDev()) break;
        const on = t.dataset.on === '1';
        const names = [...S.algSel];
        t.disabled = true;
        const ok = await safe(() => DB.setAlgFlags(names, on, null, S.me.login));
        if (ok === undefined && !DB.demo) { t.disabled = false; break; }
        await DB.addEvent({ by: S.me.login, text: `${on ? 'отметил(а) «не трогать»' : 'снял(а) «не трогать»'}: ${names.length} алг.${names.length <= 3 ? ' — ' + names.join(', ') : ''}` });
        S.algSel.clear();
        await afterChange(on ? `«Не трогать»: ${names.length}` : `Отметка снята: ${names.length}`);
        break;
      }
      case 'deploy': {
        const note = ($('#deployNote') || {}).value || '';
        const n = new Set(S.pendingVers.map(v => v.name)).size;
        if (!confirm(`Подтвердить, что ${n} ${plural(n, 'обновлённый алгоритм залит', 'обновлённых алгоритма залиты', 'обновлённых алгоритмов залиты')} на сервер ПиКТС?\nПосле этого у всех откроются «JSON с ошибками» и «JSON с оптимизированными».`)) break;
        t.disabled = true;
        const id = await safe(() => DB.confirmDeploy(note));
        if (id !== undefined) await afterChange('Выкладка подтверждена — можно перепрогонять документы с ошибками');
        else t.disabled = false;
        break;
      }
      case 'deployHistory':
        modal('Выкладки алгоритмов на сервер', S.deploys.length ? `<div class="table-wrap"><table class="t"><thead><tr><th class="nosort">№</th><th class="nosort">Когда</th><th class="nosort">Кто</th><th class="nosort num">Алгоритмов</th><th class="nosort">Комментарий</th></tr></thead>
          <tbody>${S.deploys.map(d => `<tr style="cursor:default"><td class="muted">${d.id}</td><td class="nowrap">${fmtDT(d.at, true)}</td><td>${who(d.by)}</td><td class="num">${d.algCount}</td><td>${esc(d.note || '')}</td></tr>`).join('')}</tbody></table></div>`
          : '<div class="empty">Выкладок ещё не было</div>', '<button class="btn" data-act="closeModal">Закрыть</button>');
        break;
      case 'person': S.f.all.who = t.dataset.login; S.f.all.status = 'all'; S.f.all.stage = stage2Open(t.dataset.login) && hasStage2(t.dataset.login) ? 2 : 1; S.selected.clear(); go('all'); break;
      case 'closeDrawer': closeDrawer(); break;
      case 'closeModal': closeModal(); break;
      case 'openUpload': closeModal(); openUpload(+t.dataset.id); break;
      case 'tab': S.tab = t.dataset.tab; renderDrawer(); break;
      case 'prev': navKind(-1); break;
      case 'next': navKind(1); break;
      case 'copy': try { await navigator.clipboard.writeText(t.dataset.text); toast('Скопировано'); } catch { } break;
      case 'dlRemaining': {
        const st = +t.dataset.st || 1;
        const docs = remainingDocs(t.dataset.login, st);
        if (!docs.length) { toast('Нечего запускать — всё выполнено'); break; }
        await downloadBatch(t.dataset.login, st, docs, 'остаток');
        break;
      }
      case 'dlRemainingErr': {
        const st = +t.dataset.st || 1;
        const docs = remainingErrDocs(t.dataset.login, st);
        if (!docs.length) { toast('Нечего запускать — всё выполнено без ошибок'); break; }
        await downloadBatch(t.dataset.login, st, docs, 'остаток_и_ошибочные');
        break;
      }
      case 'dlErrors': {
        const st = +t.dataset.st || 1;
        const ed = errorDocs(t.dataset.login, st);
        if (!ed.ready.length) { toast('Пока нечего перепрогонять: алгоритмы с ошибками ещё не исправлены и не выложены', true); break; }
        await downloadBatch(t.dataset.login, st, ed.ready, 'перепрогон_ошибок');
        break;
      }
      case 'dlPerf': {
        const st = +t.dataset.st || 1;
        const pd = perfDocs(t.dataset.login, st);
        if (!pd.ready.length) { toast('Пока нечего перепроверять: оптимизированные алгоритмы ещё не выложены', true); break; }
        await downloadBatch(t.dataset.login, st, pd.ready, 'оптимизированные');
        break;
      }
      case 'dlAllPendFix': {
        const st = +t.dataset.st || 1;
        const pf = pendingFixedDocs(scopeAll(), st);
        if (!pf.all.length) { toast('Нечего запускать: невыполненных и исправленных быстрых документов нет'); break; }
        await downloadBatch(S.f.all.who, st, pf.all, 'не_выполнялись_и_исправленные');
        break;
      }
      case 'smart': await safe(() => openSmart(t.dataset.login, +t.dataset.st || 1)); break;
      case 'smartDl': await downloadSmart(); break;
      case 'smartPick': {
        if (!S.smart) break;
        const k = t.dataset.key;
        if (S.smart.off.has(k)) S.smart.off.delete(k); else S.smart.off.add(k);
        renderSmart();
        break;
      }
      case 'smartAll': {
        if (!S.smart) break;
        const { visible } = smartSelection();
        const allOn = visible.every(x => !S.smart.off.has(smartKey(x)));
        visible.forEach(x => allOn ? S.smart.off.add(smartKey(x)) : S.smart.off.delete(smartKey(x)));
        renderSmart();
        break;
      }
      case 'dlFull': { const st = +t.dataset.st || 1; await downloadBatch(t.dataset.login, st, docsOf(t.dataset.login, st), ''); break; }
      case 'dlCsv': exportCsv(t.dataset.login); break;
      case 'raw': {
        const u = S.uploadsList.find(x => x.id === +t.dataset.id);
        const url = u && await safe(() => DB.rawUrl(u));
        if (url) window.open(url, '_blank');
        break;
      }
      case 'review': {
        const code = S.kindOpen;
        const stv = t.dataset.st;
        const stage = +t.dataset.stage || 1;
        const comment = $('#revComment').value.trim();
        if (stv === 'issue' && !comment) { toast('Опишите замечание в комментарии', true); $('#revComment').focus(); break; }
        t.disabled = true;
        try {
          await DB.setReview(code, stv ? { status: stv, comment, by: S.me.login, at: new Date().toISOString() } : { status: null, comment: null, by: null, at: null }, stage);
        } catch (err) { toast(err.message, true); t.disabled = false; break; }
        const sfx = stage === 2 ? ' (этап 2)' : '';
        await DB.addEvent({ by: S.me.login, kind: code, text: stv === 'ok' ? `проверил(а) ${code}${sfx} — замечаний нет` : stv === 'issue' ? `замечание по ${code}${sfx}: ${comment}` : `снял(а) отметку проверки ${code}${sfx}` });
        const pos = S.nav.indexOf(code);
        const nextCode = stv && pref('autoNext', '1') === '1' ? S.nav[pos + 1] : null;
        await afterChange(stv === 'ok' ? 'Отмечено: проверено' : stv === 'issue' ? 'Замечание сохранено' : 'Отметка снята');
        if (nextCode) go(S.route, nextCode);
        break;
      }
      case 'reassign': {
        const to = $('#reassign').value || null;
        await safe(() => DB.assign([S.kindOpen], to));
        await DB.addEvent({ by: S.me.login, kind: S.kindOpen, text: `назначил(а) ${S.kindOpen} -> ${to ? userName(to) : 'без исполнителя'}` });
        await afterChange('Исполнитель изменён');
        break;
      }
      case 'sel': if (t.checked) S.selected.add(t.dataset.code); else S.selected.delete(t.dataset.code); refreshTable('all'); break;
      case 'selAll': {
        filterKinds(viewKinds(S.f.all.stage), S.f.all).forEach(k => t.checked ? S.selected.add(k.code) : S.selected.delete(k.code));
        refreshTable('all');
        break;
      }
      case 'bulkClear': S.selected.clear(); refreshTable('all'); break;
      case 'bulkAssign': {
        const to = $('#bulkTo').value || null;
        const codes = [...S.selected];
        await safe(() => DB.assign(codes, to));
        await DB.addEvent({ by: S.me.login, text: `переназначил(а) ${codes.length} ${plural(codes.length, 'вид', 'вида', 'видов')} -> ${to ? userName(to) : 'без исполнителя'}` });
        S.selected.clear();
        await afterChange(`Переназначено: ${codes.length}`);
        break;
      }
      case 'delUpload': {
        const u = S.uploadsList.find(x => x.id === +t.dataset.id);
        if (!u || !confirm(`Удалить протокол «${u.fileName}»? Отметки о выполнении из него пропадут.`)) break;
        await safe(() => DB.deleteUpload(u));
        await DB.addEvent({ by: S.me.login, uploadId: u.id, text: `удалил(а) протокол «${u.fileName}»` });
        await afterChange('Протокол удалён');
        break;
      }
      case 'attribute': case 'unattribute': {
        const runId = +t.dataset.run;
        let code = null;
        if (act === 'attribute') {
          code = $(`[data-attr-input="${runId}"]`).value.trim();
          if (!S.kinds.some(k => k.code === code)) { toast('Нет такого кода вида', true); break; }
        }
        await safe(() => DB.updateRun(runId, { kindCode: code, match: code ? 'manual' : null }));
        if (code) await DB.addEvent({ by: S.me.login, kind: code, uploadId: +t.dataset.upload, text: `отнес(ла) документ протокола №${t.dataset.upload} к виду ${code}` });
        await afterChange(code ? 'Документ отнесён к ' + code : null);
        openUpload(+t.dataset.upload);
        break;
      }
    }
  });

  function refreshTable(page) {
    const el = $('#tbl');
    if (!el) return;
    const base = page === 'my' ? myList() : viewKinds(S.f.all.stage);
    el.innerHTML = kindsTable(filterKinds(base, S.f[page]), page);
  }

  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.act === 'q') { S.f[t.dataset.page].q = t.value; refreshTable(t.dataset.page); }
    else if (t.dataset.act === 'aq') { S.f.algs.q = t.value; renderAlgs(); }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.act === 'type') { S.f[t.dataset.page].type = t.value; renderPage(); }
    else if (t.dataset.act === 'who') { S.f.all.who = t.value; S.selected.clear(); renderPage(); }
    else if (t.dataset.act === 'autoNext') setPref('autoNext', t.checked ? '1' : '0');
    else if (t.dataset.act === 'smartOpt' && S.smart) { S.smart[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value; renderSmart(); }
  });

  document.addEventListener('keydown', e => {
    const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if (typing) { document.activeElement.blur(); return; }
      if ($$('.modal-layer').length) closeModal();
      else if (S.kindOpen) closeDrawer();
      return;
    }
    if (typing || !S.me) return;
    if (e.key === '/') {
      const q = $('#q-' + (S.route === 'algs' ? 'algs' : S.route));
      if (q) { e.preventDefault(); q.focus(); q.select(); }
    } else if (S.kindOpen && !$$('.modal-layer').length && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
      e.preventDefault();
      navKind(e.key === 'ArrowRight' ? 1 : -1);
    }
  });

  window.addEventListener('hashchange', () => { if (S.me) route(); });

  // фоновое обновление: если кто-то загрузил протокол — у остальных страница обновится сама
  setInterval(async () => {
    if (!S.me || S.uploading || document.visibilityState !== 'visible' || S.kindOpen) return;
    if ($$('.modal-layer').length || (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) return;
    try {
      if (await loadState()) { S.algs = null; renderShell(); renderPage(); }
    } catch { }
  }, 60000);

  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  (async () => {
    try { await DB.init(); }
    catch (e) { $('#app').innerHTML = `<div class="login-wrap"><div class="card card-pad" style="max-width:520px"><h2>Не удалось запуститься</h2><div style="color:var(--err)">${esc(e.message)}</div></div></div>`; return; }
    await boot();
  })();
})();

</script>
</body>
</html>
