/* ---------- кнопки, поля */

/* ---------- шапка */

.pill.rev { background: var(--rev-soft); color: var(--rev); }

.pill.plain { background: var(--surface-2); color: var(--muted); }
.type { font-size: 12px; color: var(--muted); white-space: nowrap; }

.tl.ok::before { border-color: var(--ok); }
.tl.errors::before { border-color: var(--err); }
.tl.interrupted::before { border-color: var(--int); }

.tl .h { display: flex; justify-content: space-between; gap: 10px; }
.close-x { margin-left: 4px; }
.kbd-hint { color: var(--faint); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }

/* ---------- модальные окна */
.modal { position: fixed; left: 50%; top: 7vh; transform: translateX(-50%); width: min(860px, calc(100vw - 24px)); max-height: 86vh; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; z-index: 52; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: pop .16s ease-out; }

.modal .mh h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.modal .mb { padding: 18px 22px; overflow: auto; }
.modal .mf { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.report { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.report .nums { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.big-ok { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--accent-soft); margin-bottom: 14px; }

/* ---------- команда */
.team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1150px) { .team { grid-template-columns: repeat(2, 1fr); } }

/* ---------- вход */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }

.login .side { background: linear-gradient(145deg, var(--accent), var(--accent-2) 60%, #9b5cff); color: #fff; padding: 36px; display: flex; flex-direction: column; gap: 16px; position: relative; }

.toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 95; }

/* ---------- демо-режим */

}

  background: linear-gradient(120deg, #ff6a3d, #ff3d8b 35%, #8a5cff 70%, #3d8bff); background-size: 220% 220%;

.btn.smart-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -10px rgba(138, 92, 255, .85), 0 0 0 1px rgba(255, 255, 255, .2) inset; color: #fff; }

  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: smartShine 3.2s ease-in-out infinite; }

<body>
<div id="app"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
// Разбор протокола ПиКТС 2.0 в браузере.
// Пакет («Пакетное выполнение алгоритмов актуализации»): документ начинается строкой «=== Passport (guid), N/M ===»;
// документ выполнен, если пришло «Время выполнения LoadDocumentAsync», начался следующий документ или «Операция завершена».
// Документ, на котором протокол оборвался (сервер упал) или началась новая операция, — прерван.
// Одиночная «Актуализация данных» (без guid): документ определяется по составу алгоритмов.
// После LoadDocumentAsync платформа выполняет генерацию связей документа (…ГенерацияСвязей, DocLinkGenerator…, EL_…_TO.TOList) —
// это часть того же документа, а не отдельный документ без GUID.
// Время в протоколе — UTC: при разборе прибавляется shiftHours (по умолчанию 3 — московское).
const LogParser = (() => {
  const LINK_RX = /(ГенерацияСвяз|DocLinkGenerator|\.Link$|\.Связь$|DocLink$|_TO\.TO(List|Single)$)/i;
  const RX = {
    line: /^(\d{4})\.(\d{2})\.(\d{2}) (\d{2}):(\d{2}):(\d{2}),MessageType=(\w+),Message=(.*)$/,
    docStart: /^===\s*(\w+)\s*\(([0-9a-fA-F-]{36})\)\s*,\s*(\d+)\s*\/\s*(\d+)\s*===/,
    operStart: /^Операция запущена:\s*(.*)$/,
    operEnd: /^Операция завершена:\s*(.*)$/,
    algStart: /^(.+?): Алгоритм запущен\s*\((\d+)\)/,
    algEnd: /^(.+?): Алгоритм завершен\s*\((\d+)\)\s*(\S+)/,
    algFail: /^(.+?): Ошибка выполнения алгоритма\s*(.*)$/,
    loaderFail: /Не удалось выполнить алгоритм\s*"([^"]+)"\s*;?\s*(.*)$/,
    loadDone: /Время выполнения LoadDocumentAsync:\s*(\S+)/,
    algMsg: /^([A-Za-zА-Яа-яЁё0-9_]+(?:\.[A-Za-zА-Яа-яЁё0-9_]+)+):\s([\s\S]*)$/,
    ver: /^(.+?):\s*\[PKTS-VER\s+([0-9.]+)\]/,   // метка версии алгоритма (первая строка Run)
    summary: /^Сводка:\s*(.*)$/,
  };

  // «Серверные проблемы» — не ошибки наших алгоритмов: незаданные/невыбранные параметры и сообщения проверки данных, подписанты,
  // не скомпилирован алгоритм проверки, нет колонки в шаблоне, обрыв соединения / перезапуск. Таймауты 57P01/57014 (запрос снят по
  // лимиту ~10 мин) — наши: алгоритм медленный, его оптимизируют. Те же правила — в tools/errors_export.py и tools/backfill_srv.py.
  const SRV_PARAM = /не\s+задан|не\s+заданы|не\s+задано|не\s+выбран|не\s+заполнен|не\s+указан|не\s+введен|ошибки\s+заполнения\s+параметров|не\s+все\s+обязательные\s+параметры|заданы\s+не\s+все\s+параметры|обязательн\w*\s+значени\w*\s+параметр|необходимо\s+(выбрать|заполнить|указать)|выберите\s|заполните\s/i;
  const SRV_NOT_PARAM = /PKTS-QUERYLOOP|PKTS-COLSAFE|PKTS-LINK|Не найдены данные по заданным параметрам|нет в шаблоне/i;
  function srvError(alg, msg, details) {
    const m = String(msg || '');
    // таймаут — наш (в т.ч. «transient failure» EF, внутри которого 57P01)
    if (/57P01|57014/.test(m + ' ' + (details || '')) && !/Connection refused|Exception while reading from stream/.test(m)) return false;
    if (/terminating connection|transient failure|Connection refused|Exception while reading from stream/.test(m)) return true;
    if (/несуществующей колонке/.test(m)) return true;
    if (/^Внимание|Ошибки заполнения параметров|Не удалось выполнить алгоритм проверки значений|не скомпилирован|Не получилось найти сборку|подписант|должно быть|Заполните/i.test(m)) return true;
    if (/^Не (задан|указан|заполнен|выбран|введен)/i.test(m)) return true;
    if (/(_Param|Валидация\w*|ПроверкаПараметров\w*|ВходныеПараметрыОтчета|ParamCheck|_00_Param)$/.test(alg || '')) return true;
    return SRV_PARAM.test(m) && !SRV_NOT_PARAM.test(m);
  }

      last, available, pending, deploy: dep || null, observed: o, perf: vs.some(v => v.kind === 'perf'),

      rollback: !!(o && o.max > o.last),            // раньше видели версию выше — откат или залит старый пакет
      notes: vs.map(v => `${verLabel(v.version)}${v.kind === 'perf' ? ' (оптимизация)' : ''}${v.note ? ': ' + v.note : ''}`).join('\n'),
    };
  }

  // =====================================================================================================================
  // данные
  const unitKey = (guid, ps) => (guid || '') + '|' + (ps || '');

  function docState(list) {
    const fins = list.filter(r => r.finished);
    const fin = fins[fins.length - 1] || null;
    const last = list[list.length - 1] || null;
    const st = { runs: list.length, fin, last, status: 'pending', errors: 0, srv: 0, ignored: 0, errAlgs: [], fix: null, sec: null,
      lastRunAt: last ? last.startAt : null, firstDoneAt: fins.length ? fins[0].startAt : null, running: null };
    if (fin) {
      const e = effErrors(fin);
      const srv = (fin.srvProblems || []).length;   // серверные проблемы: параметры, проверка данных, подписанты, обрывы
      Object.assign(st, { errors: e.eff, srv, ignored: e.ign, errAlgs: e.algs, status: e.eff ? 'errors' : srv ? 'server' : 'ok', sec: docSec(fin) });
      if (e.eff) st.fix = fixOf(e.algs, fin);
      st.perf = fixOf(fin.algNames || [], fin, true);   // в документе выполнялись оптимизированные алгоритмы
    } else if (last) {
      st.status = 'interrupted';
      st.running = last.running && last.running.length ? last.running.join(', ') : null;
    }
    return st;
  }

  function agg2(docs) {
    const a = { total: docs.length, ok: 0, errors: 0, server: 0, interrupted: 0, pending: 0, errSum: 0, srvSum: 0, ignSum: 0, secs: [], lastRunAt: null, firstDoneAt: null, fixDeployed: 0, fixPending: 0, perfDeployed: 0 };
    for (const d of docs) {
      a[d.st.status]++;
      a.errSum += d.st.errors;
      a.srvSum += d.st.srv || 0;
      a.ignSum += d.st.ignored;
      if (d.st.sec != null) a.secs.push(d.st.sec);
      if (d.st.lastRunAt && ts(d.st.lastRunAt) > ts(a.lastRunAt)) a.lastRunAt = d.st.lastRunAt;
      if (d.st.fix === 'deployed') a.fixDeployed++; else if (d.st.fix === 'pending') a.fixPending++;
      if (d.st.perf === 'deployed') a.perfDeployed++;
    }
    a.done = a.ok + a.errors + a.server;
    a.remaining = a.pending + a.interrupted;
    a.status = !a.total ? null : !a.remaining ? (a.errors ? 'errors' : a.server ? 'server' : 'ok') : !a.done ? (a.interrupted ? 'interrupted' : 'pending') : 'partial';
    return a;
  }

  async function loadState() {
    const [users, kinds, runs, uploads, instances, meta] = await Promise.all([DB.users(), DB.kinds(), DB.runsLight(), DB.uploads(), DB.instances(), DB.algMeta()]);
    S.users = users;
    S.team = teamOf(users);
    S.uploadsList = uploads;
    S.runs = runs;
    S.instances = instances;
    S.flags = new Map(meta.flags.map(f => [f.name, f]));
    S.deploys = meta.deploys.slice().sort((a, b) => b.id - a.id);
    S.deployById = new Map(meta.deploys.map(d => [d.id, d]));
    S.versions = new Map();
    meta.versions.slice().sort((a, b) => a.id - b.id).forEach(v => { if (!S.versions.has(v.name)) S.versions.set(v.name, []); S.versions.get(v.name).push(v); });
    // версии, замеченные в протоколах ([PKTS-VER]): последняя по времени прогона, максимальная и когда впервые видели каждую
    S.observed = new Map();
    for (const r of runs.slice().sort((a, b) => ts(a.startAt) - ts(b.startAt))) {
      for (const [name, label] of Object.entries(r.algVers || {})) {
        const n = verNum(label);
        if (n == null) continue;
        let o = S.observed.get(name);
        if (!o) S.observed.set(name, o = { last: n, max: n, at: r.startAt, firstAt: 0, seen: {} });
        o.last = n; o.at = r.startAt; o.max = Math.max(o.max, n);
        if (!o.seen[n]) o.seen[n] = ts(r.startAt);
      }
    }
    S.observed.forEach(o => { o.firstAt = o.seen[o.last] || 0; });
    S.pendingVers = meta.versions.filter(v => !isDeployed(v));
    S.links = new Set(kinds.flatMap(k => k.linkAlgs || []).map(a => a.toLowerCase()));

    const cmp = (a, b) => ts(a.startAt) - ts(b.startAt) || a.uploadId - b.uploadId || a.id - b.id;
    const byUnit = new Map();
    const push = (key, r) => { if (!byUnit.has(key)) byUnit.set(key, []); byUnit.get(key).push(r); };
    for (const r of runs) if (r.kindCode) push(r.guid ? unitKey(r.guid, r.ps) : 'k:' + r.kindCode, r);
    byUnit.forEach(l => l.sort(cmp));
    const instByKind = new Map();
    for (const x of instances) { if (!instByKind.has(x.kindCode)) instByKind.set(x.kindCode, []); instByKind.get(x.kindCode).push(x); }

    const secs = [];
    S.kinds = kinds.map(k => {
      // первый этап: экземпляр вида со своим набором (у аналитических — код набора из «Все гуиды»); прежние прогоны с BatchRun тоже учитываются
      const l1 = (k.guid ? (byUnit.get(unitKey(k.guid, k.ps || '')) || []).concat(k.ps ? (byUnit.get(unitKey(k.guid, '')) || []) : []) : []).concat(byUnit.get('k:' + k.code) || []).sort(cmp);
      const s1 = docState(l1);
      if (s1.sec != null) secs.push(s1.sec);
      const docs2 = (instByKind.get(k.code) || []).sort((a, b) => a.ord - b.ord)
        .map(x => ({ ...x, st: docState(byUnit.get(unitKey(x.guid, x.ps)) || []) }));
      return {
        ...k, algCount: k.algorithms.length, s1,
        status: l1.length ? s1.status : (k.guid ? 'pending' : 'noinstance'),
        lastRunAt: s1.lastRunAt, docSec: s1.sec, errors: s1.errors, srv: s1.srv, ignored: s1.ignored, fix: s1.fix, perf: s1.perf,
        warnings: s1.fin ? s1.fin.warnings : 0, runs: l1.length, finRunId: s1.fin ? s1.fin.id : null,
        firstDoneAt: s1.firstDoneAt, running: s1.running,
        docs2, s2: agg2(docs2),
      };
    });
    S.avgDocSec = secs.length ? secs.reduce((a, b) => a + b, 0) / secs.length : null;
    const sig = S.kinds.map(k => k.status + k.errors + (k.reviewStatus || '') + (k.review2Status || '') + (k.reviewComment || '').length + (k.assignee || '') + k.runs
      + '/' + k.s2.done + k.s2.errSum + k.s2.interrupted).join('|') + '#' + uploads.length + '#' + meta.flags.map(f => f.name + f.ignored).join() + '#' + meta.versions.length + '#' + meta.deploys.length;
    const changed = sig !== S.sig;
    S.sig = sig;
    return changed;
  }

  // этап человека: второй открывается, когда выполнено 100% документов первого
  function stage1Left(login) {
    const l = S.kinds.filter(k => k.assignee === login && k.guid);
    return { total: l.length, left: l.filter(k => !isDone(k.status)).length };
  }
  const stage2Open = login => { const x = stage1Left(login); return x.total > 0 && x.left === 0; };
  const hasStage2 = login => S.kinds.some(k => k.assignee === login && k.docs2.length);
  function pageStage(page) {
    if (page === 'my') return S.f.my.stage || (stage2Open(S.me.login) && hasStage2(S.me.login) ? 2 : 1);
    if (page === 'all') return S.f.all.stage;
    return 1;
  }
  const curStage = () => (S.route === 'my' || S.route === 'all') ? pageStage(S.route) : 1;

  // строка таблицы для этапа: на втором — агрегат по экземплярам вида
  function viewOf(k, stage) {
    if (stage !== 2) return k;
    const a = k.s2;
    return {
      ...k, status: a.status, errors: a.errSum, srv: a.srvSum, ignored: a.ignSum, docSec: a.secs.length ? a.secs.reduce((x, y) => x + y, 0) / a.secs.length : null,
      lastRunAt: a.lastRunAt, running: null, progress: a,
      fix: a.fixDeployed ? 'deployed' : a.fixPending ? 'pending' : null, perf: a.perfDeployed ? 'deployed' : null,
      reviewStatus: k.review2Status, reviewComment: k.review2Comment, reviewBy: k.review2By, reviewAt: k.review2At,
    };
  }
  const viewKinds = stage => stage === 2 ? S.kinds.filter(k => k.docs2.length).map(k => viewOf(k, 2)) : S.kinds;

  function stats(list, stage) {
    const s = { all: list.length, total: 0, ok: 0, errors: 0, server: 0, partial: 0, interrupted: 0, pending: 0, noinstance: 0, reviewed: 0, issues: 0, secs: [] };
    for (const k of list) {
      if (stage === 2) {
        const a = k.progress;
        s.total += a.total; s.ok += a.ok; s.errors += a.errors; s.server += a.server; s.interrupted += a.interrupted; s.pending += a.pending;
        s.secs.push(...a.secs);
      } else {
        s[k.status]++;
        if (k.status !== 'noinstance') s.total++;
        if (k.docSec != null) s.secs.push(k.docSec);
      }
      if (k.reviewStatus === 'ok') s.reviewed++;
      if (k.reviewStatus === 'issue') s.issues++;
    }
    s.done = s.ok + s.errors + s.server;
    s.remaining = s.pending + s.interrupted;
    s.reviewable = list.filter(k => isDone(k.status)).length;
    s.toReview = list.filter(k => isDone(k.status) && !k.reviewStatus).length;
    s.pct = !s.total ? 0 : s.done === s.total ? 100 : Math.min(99, Math.round((s.done / s.total) * 100));
    s.avg = s.secs.length >= 3 ? s.secs.reduce((a, b) => a + b, 0) / s.secs.length : S.avgDocSec;
    s.eta = s.avg != null ? s.avg * s.remaining : null;
    return s;
  }

  // документы человека для пакета: этап 1 — экземпляр вида, этап 2 — экземпляры второго этапа
  function docsOf(login, stage) {
    const mine = S.kinds.filter(k => k.assignee === login);
    return stage === 2
      ? mine.flatMap(k => k.docs2.map(d => ({ kind: k.code, doctype: d.doctype, guid: d.guid, ps: d.ps, st: d.st })))
      : mine.filter(k => k.guid).map(k => ({ kind: k.code, doctype: k.doctype, guid: k.guid, ps: k.ps || '', st: k.s1 }));
  }
  const remainingDocs = (login, stage) => docsOf(login, stage).filter(d => d.st.status === 'pending' || d.st.status === 'interrupted');
  // остаток + документы, где были ошибки (все, независимо от исправления/выкладки)
  const remainingErrDocs = (login, stage) => docsOf(login, stage).filter(d => d.st.status === 'pending' || d.st.status === 'interrupted' || d.st.status === 'errors');
  // документы, где выполнялись оптимизированные алгоритмы: перепроверить после выкладки
  function perfDocs(login, stage) {
    const e = docsOf(login, stage).filter(d => d.st.perf);
    return { all: e, ready: e.filter(d => d.st.perf === 'deployed'), waiting: e.filter(d => d.st.perf === 'pending') };
  }
  function errorDocs(login, stage) {
    const e = docsOf(login, stage).filter(d => d.st.status === 'errors');
    return { all: e, ready: e.filter(d => d.st.fix === 'deployed'), waiting: e.filter(d => d.st.fix === 'pending'), open: e.filter(d => !d.st.fix) };
  }

  // «Все виды»: документы видов страницы (этап 1 — экземпляр вида, этап 2 — экземпляры второго этапа), ещё не выполнявшиеся,
  // плюс документы с ошибками, у которых исправление уже выложено на сервер, а последний прогон шёл меньше 5 минут
  function docsOfKinds(kinds, stage) {
    return stage === 2
      ? kinds.flatMap(k => (k.docs2 || []).map(d => ({ kind: k.code, doctype: d.doctype, guid: d.guid, ps: d.ps, st: d.st })))
      : kinds.filter(k => k.guid).map(k => ({ kind: k.code, doctype: k.doctype, guid: k.guid, ps: k.ps || '', st: k.s1 }));
  }
  function pendingFixedDocs(kinds, stage) {
    const all = docsOfKinds(kinds, stage);
    const pending = all.filter(d => d.st.status === 'pending');
    const fixed = all.filter(d => d.st.status === 'errors' && d.st.fix === 'deployed' && d.st.sec != null && d.st.sec < SLOW_SEC);
    return { pending, fixed, all: pending.concat(fixed) };
  }

  // JSON пакета: группы (тип документа, набор параметров) в порядке, в котором их выполняет сервер; items — для сопоставления N/M протокола
  function buildBatch(docs) {
    const seen = new Set();
    const list = docs.filter(d => { const k = unitKey(d.guid, d.ps); if (seen.has(k)) return false; seen.add(k); return true; })
      .sort((a, b) => (a.doctype < b.doctype ? -1 : a.doctype > b.doctype ? 1 : 0) || ((a.ps || '') < (b.ps || '') ? -1 : (a.ps || '') > (b.ps || '') ? 1 : 0) || (a.guid < b.guid ? -1 : a.guid > b.guid ? 1 : 0));
    const groups = [];
    for (const d of list) {
      const g = groups[groups.length - 1];
      if (g && g.doctype === d.doctype && g.ps === (d.ps || '')) g.ids.push(d.guid);
      else groups.push({ doctype: d.doctype, ps: d.ps || '', ids: [d.guid] });
    }
    const text = JSON.stringify({ documents: groups.map(g => ({ doctype: g.doctype, ids: g.ids, paramValueSetCode: g.ps || 'BatchRun' })) }, null, 4).replace(/\n/g, '\r\n') + '\r\n';
    return { text, items: list.map(d => [d.doctype, d.guid, d.ps || '']), count: list.length };
  }
  async function downloadBatch(login, stage, docs, suffix) {
    if (!docs.length) { toast('Нечего запускать'); return; }
    const b = buildBatch(docs);
    downloadText(`перепроверка_${login === 'all' ? 'все' : login === 'none' ? 'без_исполнителя' : userName(login)}${stage === 2 ? '_этап2' : ''}${suffix ? '_' + suffix : ''}_${stamp()}.txt`, b.text);
    toast(`Скачан JSON: ${b.count} ${plural(b.count, 'документ', 'документа', 'документов')}`);
    // порядок пакета запоминается: по номеру N/M в протоколе потом определяется набор параметров
    try { await DB.saveBatch(S.me.login, stage, b.items); } catch (e) { console.warn('batch', e); }
  }

  // ---- умная выгрузка JSON («Мои виды»): не проверявшиеся + исправленные ошибки (выложено) + оптимизации (выложено),
  // от быстрых к медленным по оценке времени; тяжёлые (прерывались, ≥30 мин, уровень ПАО от 10 мин) — хвостом в конце.
  // Сервер выполняет группы JSON строго по порядку (повторять группу тип+набор можно), поэтому порядок документов сохраняется.
  const SMART_HEAVY_SEC = 1800;
  const SMART_CAT = { fixed: 'исправлены ошибки', perf: 'оптимизация', new: 'не проверялся', cut: 'прерывался' };
  let smartAlgStats = null;   // алгоритм -> медиана времени (maxSec) по прогонам; семейство (до первой точки) -> медиана
  async function loadAlgStats() {
    if (smartAlgStats && smartAlgStats.n === S.runs.length) return smartAlgStats;
    const rows = await DB.runsAlgs(S.runs.map(r => r.id));
    const add = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    const by = new Map(), fam = new Map();
    for (const r of rows) for (const a of (r.algs || [])) {
      if (!a || !a.name || !a.count) continue;   // count 0 — алгоритм в прогоне не выполнялся
      const v = +a.maxSec || 0;
      add(by, a.name, v);
      add(fam, a.name.split('.')[0], v);
    }
    const med = l => { const s = l.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
    smartAlgStats = { n: S.runs.length, alg: new Map([...by].map(([k, l]) => [k, med(l)])), fam: new Map([...fam].map(([k, l]) => [k, med(l)])) };
    return smartAlgStats;
  }
  function typeMedianSec(doctype, category) {
    const l = S.kinds.filter(k => k.doctype === doctype && (k.category || '') === (category || '') && k.docSec != null).map(k => k.docSec).sort((a, b) => a - b);
    return l.length ? l[Math.floor(l.length / 2)] : S.avgDocSec;
  }
  // оценка времени документа: прошлый прогон; прерванный — время до обрыва («не меньше»); без прогонов — по алгоритмам вида
  // (самый долгий или сумма на 4 потока секций), затем по семейству алгоритмов, затем по типу документа
  function estimateDoc(d, k, stats, stage) {
    const st = d.st;
    if (isDone(st.status) && st.sec != null) return { sec: st.sec, src: 'прошлый прогон' };
    if (st.status === 'interrupted' && st.last) {
      const up = S.uploadsList.find(u => u.id === st.last.uploadId);
      const s = up && up.logTo ? (ts(up.logTo) - ts(st.last.startAt)) / 1000 : null;
      return { sec: s != null && s > 0 ? s : null, src: 'до обрыва', atLeast: true };
    }
    if (stage === 2 && k && k.s1 && k.s1.sec != null) return { sec: k.s1.sec, src: 'по первому этапу' };
    const t = []; let approx = false;
    for (const n of (k && k.algorithms) || []) {
      const f = String(n).split('.')[0];
      if (stats.alg.has(n)) t.push(stats.alg.get(n));
      else if (stats.fam.has(f)) { t.push(stats.fam.get(f)); approx = true; }
      else approx = true;
    }
    if (t.length) return { sec: Math.max(Math.max(...t), t.reduce((a, b) => a + b, 0) / Math.min(4, t.length)), src: approx ? 'по похожим алгоритмам' : 'по алгоритмам' };
    return { sec: typeMedianSec(d.doctype, k && k.category), src: 'по типу документа' };
  }
  function smartDocs(login, stage, stats) {
    const kindBy = new Map(S.kinds.map(k => [k.code, k]));
    const out = [];
    for (const d of docsOf(login, stage)) {
      const st = d.st;
      const cat = st.status === 'pending' ? 'new'
        : st.status === 'interrupted' ? 'cut'
        : st.status === 'errors' && st.fix === 'deployed' ? 'fixed'
        : isDone(st.status) && st.perf === 'deployed' ? 'perf' : null;
      if (!cat) continue;
      const k = kindBy.get(d.kind);
      const e = estimateDoc(d, k, stats, stage);
      const heavy = cat === 'cut' || (e.sec != null && e.sec >= SMART_HEAVY_SEC) || (/ПАО/.test(d.kind) && (e.sec == null || e.sec >= 600));
      out.push({ ...d, cat, est: e.sec, src: e.src, atLeast: !!e.atLeast, heavy, name: k ? k.name : '' });
    }
    const rank = { fixed: 0, perf: 1, new: 2, cut: 3 };
    const key = x => x.est == null ? Infinity : x.est;
    return out.sort((a, b) => (a.heavy - b.heavy) || key(a) - key(b) || rank[a.cat] - rank[b.cat] || (a.kind < b.kind ? -1 : a.kind > b.kind ? 1 : 0));
  }
  // JSON с сохранением порядка: новая группа — когда меняется тип документа или набор; соседние одинаковые склеиваются
  function buildBatchOrdered(docs) {
    const seen = new Set();
    const list = docs.filter(d => { const k = unitKey(d.guid, d.ps); if (seen.has(k)) return false; seen.add(k); return true; });
    const groups = [];
    for (const d of list) {
      const g = groups[groups.length - 1];
      if (g && g.doctype === d.doctype && g.ps === (d.ps || '')) g.ids.push(d.guid);
      else groups.push({ doctype: d.doctype, ps: d.ps || '', ids: [d.guid] });
    }
    const text = JSON.stringify({ documents: groups.map(g => ({ doctype: g.doctype, ids: g.ids, paramValueSetCode: g.ps || 'BatchRun' })) }, null, 4).replace(/\n/g, '\r\n') + '\r\n';
    return { text, items: list.map(d => [d.doctype, d.guid, d.ps || '']), count: list.length };
  }
  const fmtEst = x => x.est == null ? '?' : (x.atLeast ? '≥ ' : '') + (x.est < 60 ? '< 1 мин' : `${Math.round(x.est / 60)} мин`);
  const fmtTotal = sec => sec < 3600 ? `${Math.max(1, Math.round(sec / 60))} мин` : `${Math.floor(sec / 3600)} ч ${Math.round((sec % 3600) / 60)} мин`;
  const smartKey = x => unitKey(x.guid, x.ps);
  // видимые в окне (по галочке «тяжёлые» и порогу) и выбранные (без снятых галочек); разбивка на файлы по времени
  function smartSelection() {
    const sm = S.smart;
    const lim = +sm.limit || 0;
    const visible = sm.list.filter(x => (sm.heavy || !x.heavy) && (!lim || (x.est != null && x.est <= lim * 60)));
    const list = visible.filter(x => !sm.off.has(smartKey(x)));
    const parts = [];
    const per = +sm.split || 0;
    let cur = [], acc = 0;
    for (const x of list) {
      const s = x.est != null ? x.est : 600;
      if (per && cur.length && (acc + s > per * 60 || (x.heavy && !cur[cur.length - 1].heavy))) { parts.push(cur); cur = []; acc = 0; }
      cur.push(x); acc += s;
    }
    if (cur.length) parts.push(cur);
    return { visible, list, parts };
  }
  const SMART_PILL = { fixed: 'ok', perf: 'rev', new: 'new', cut: 'cut' };
  function renderSmart() {
    const sm = S.smart;
    const { visible, list, parts } = smartSelection();
    const sum = list.reduce((a, x) => a + (x.est != null ? x.est : 0), 0);

    const allOn = visible.length && visible.every(x => !sm.off.has(smartKey(x)));

      <div class="sm-chips">
        <span class="sm-chip ok"><b>${cnt('fixed')}</b> исправлены ошибки</span>
        <span class="sm-chip rev"><b>${cnt('perf')}</b> оптимизация</span>
        <span class="sm-chip new"><b>${cnt('new')}</b> не проверялись</span>

      <div class="sm-opts">
        <label class="sm-opt"><input type="checkbox" data-act="smartOpt" data-k="heavy" ${sm.heavy ? 'checked' : ''}> тяжёлые в конце <span class="muted">(${nHeavy})</span></label>
        <label class="sm-opt">не брать дольше <select class="input sm-sel" data-act="smartOpt" data-k="limit">${opt(0, sm.limit, 'без ограничения')}${opt(10, sm.limit, '10 мин')}${opt(30, sm.limit, '30 мин')}${opt(60, sm.limit, '60 мин')}</select></label>
        <label class="sm-opt">файлы <select class="input sm-sel" data-act="smartOpt" data-k="split">${opt(0, sm.split, 'одним файлом')}${opt(30, sm.split, 'по ~30 мин')}${opt(60, sm.split, 'по ~60 мин')}${opt(120, sm.split, 'по ~2 ч')}</select></label>

        <tbody>${rows || '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">Под выбранные условия ничего не попало</td></tr>'}</tbody></table></div>`;

  async function openSmart(login, stage) {
    toast('Считаю оценки времени…');
    const stats = await loadAlgStats();
    const list = smartDocs(login, stage, stats);
    if (!list.length) { toast('Нечего выгружать: не проверявшихся, исправленных и оптимизированных (выложенных) документов нет'); return; }
    S.smart = { login, stage, list, heavy: true, limit: 0, split: 0, off: new Set() };
    modal('Умная выгрузка JSON', '<div id="smartBody"></div>',
      `<div id="smartInfo" class="sm-info"></div><button class="btn" data-act="closeModal">Закрыть</button><button class="btn primary" id="smartDl" data-act="smartDl">Скачать JSON</button>`);
    $('.modal').classList.add('wide');
    renderSmart();
  }
  async function downloadSmart() {
    const sm = S.smart;
    const { parts } = smartSelection();
    if (!parts.length) { toast('Ничего не выбрано'); return; }
    const who = userName(sm.login);
    for (let i = 0; i < parts.length; i++) {
      const b = buildBatchOrdered(parts[i]);
      downloadText(`перепроверка_${who}${sm.stage === 2 ? '_этап2' : ''}_умная${parts.length > 1 ? `_${i + 1}из${parts.length}` : ''}_${stamp()}.txt`, b.text);
      try { await DB.saveBatch(S.me.login, sm.stage, b.items); } catch (e) { console.warn('batch', e); }
      if (i < parts.length - 1) await new Promise(r => setTimeout(r, 400));
    }
    const n = parts.reduce((a, p) => a + p.length, 0);
    toast(`Скачано: ${n} ${plural(n, 'документ', 'документа', 'документов')}${parts.length > 1 ? ` в ${parts.length} файлах` : ''}`);
    closeModal();
  }

  function exportCsv(login) {
    const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
    const rows = [['Код вида', 'Наименование', 'Тип', 'Исполнитель', 'GUID экземпляра', 'Алгоритмов', 'Статус', 'Последний прогон', 'Время документа, с', 'Ошибок',
      'Ошибок в «не трогать»', 'Проверка', 'Комментарий', 'Проверил', 'Этап 2: документов', 'Этап 2: выполнено', 'Этап 2: с ошибками', 'Этап 2: проверка'].map(q).join(';')];
    S.kinds.filter(k => !login || k.assignee === login).forEach(k => rows.push([
      q(k.code), q(k.name), q(typeRu(k.doctype, k.category)), q(k.assignee ? userName(k.assignee) : ''), q(k.guid), k.algCount, q(STATUS[k.status].label),
      q(k.lastRunAt ? fmtDT(k.lastRunAt, true) : ''), k.docSec != null ? String(Math.round(k.docSec * 10) / 10).replace('.', ',') : '', k.errors, k.ignored,
      q(k.reviewStatus === 'ok' ? 'Проверено' : k.reviewStatus === 'issue' ? 'Замечание' : ''), q(k.reviewComment), q(k.reviewBy ? userName(k.reviewBy) : ''),
      k.s2.total, k.s2.done, k.s2.errors, q(k.review2Status === 'ok' ? 'Проверено' : k.review2Status === 'issue' ? 'Замечание: ' + (k.review2Comment || '') : ''),
    ].join(';')));

  }

    $('#app').innerHTML = '<div class="login-wrap"><span class="spin" style="width:28px;height:28px;border-width:3px"></span></div>';

    const backfill = async () => { try { while (await DB.backfillRaw(5) > 0) { } } catch (e) { console.warn('backfill', e); } };

  // =====================================================================================================================
  // компоненты
  function donut(s, size = 132, stroke = 13) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, t = s.total || 1;
    let off = 0;
    const seg = (n, col) => {
      if (!n) return '';
      const len = (n / t) * c;
      const el = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;
      off += len;
      return el;
    };
    return `<div class="donut" style="width:${size}px;height:${size}px">
      <svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
        ${seg(s.ok, 'var(--ok)')}${seg(s.server, 'var(--srv)')}${seg(s.errors, 'var(--err)')}${seg(s.interrupted, 'var(--int)')}</svg>
      <div class="c"><div><b>${s.pct}%</b><span>выполнено</span></div></div></div>`;
  }

  function progressBar(s, thin) {
    const t = s.total || 1;
    const seg = k => s[k] ? `<div title="${STATUS[k].many}: ${s[k]}" style="width:${(s[k] / t) * 100}%;background:${STATUS[k].color}"></div>` : '';
    return `<div class="progress ${thin ? 'thin' : ''}">${seg('ok')}${seg('server')}${seg('errors')}${seg('interrupted')}</div>`;
  }

    return `<div class="stagebar">
      <div class="seg">

  function steps(login, s, stage) {
    const n = s.remaining;
    const mine = login === S.me.login;
    const ed = errorDocs(login, stage);
    const pd = perfDocs(login, stage);
    const nRE = n + ed.all.length;
    const pdWhy = pd.ready.length ? `Оптимизировано и выложено — перепроверить: <b style="color:var(--text)">${pd.ready.length}</b> ${plural(pd.ready.length, 'документ', 'документа', 'документов')}.`
      : pd.waiting.length ? `Оптимизация в ${pd.waiting.length} ${plural(pd.waiting.length, 'документе', 'документах', 'документах')} ждёт выкладки на сервер — потом откроется «JSON с оптимизированными».` : '';
    const why = !ed.all.length ? 'Документов с ошибками нет.'
      : ed.ready.length ? `Исправлено и выложено на сервер: <b style="color:var(--text)">${ed.ready.length}</b> из ${ed.all.length} с ошибками.${ed.waiting.length ? ` Ещё ${ed.waiting.length} — исправлены, ждут выкладки.` : ''}`
        : ed.waiting.length ? `Алгоритмы ${ed.waiting.length} ${plural(ed.waiting.length, 'документа', 'документов', 'документов')} уже исправлены, но ещё не залиты на сервер — кнопка откроется, когда разработчик подтвердит выкладку.`
          : `Ошибки в ${ed.all.length} ${plural(ed.all.length, 'документе', 'документах', 'документах')} ещё не исправлены — кнопка откроется после исправления и выкладки алгоритмов.`;
    return `<div class="steps">
      <div class="card step ${s.remaining === 0 && s.total ? 'done' : ''}">
        <div class="t"><span class="n">1</span>Скачайте пакет${stage === 2 ? ' этапа 2' : ''}</div>
        <div class="d">${n ? `JSON только с тем, что ещё не выполнилось — <b style="color:var(--text)">${n} ${plural(n, 'документ', 'документа', 'документов')}</b>. После падения сервера просто скачайте его заново.` : 'Все документы выполнены — запускать нечего.'}</div>
        <div class="acts">
          <button class="btn smart-btn" data-act="smart" data-login="${esc(login)}" data-st="${stage}" title="Не проверявшиеся, исправленные и оптимизированные (выложенные) — от быстрых к медленным, тяжёлые в конце"><span class="spark">✦</span>Умная выгрузка JSON<span class="smart-tag">рекомендуем</span></button>
          <button class="btn" data-act="dlRemaining" data-login="${esc(login)}" data-st="${stage}" ${n ? '' : 'disabled'}>${I.dl}JSON остатка</button>
          <button class="btn" data-act="dlRemainingErr" data-login="${esc(login)}" data-st="${stage}" ${nRE ? '' : 'disabled'} title="Невыполненные и прерванные документы плюс все документы, в которых были ошибки">${I.dl}остаток + ошибочные${nRE ? ` (${nRE})` : ''}</button>
          <button class="btn" data-act="dlErrors" data-login="${esc(login)}" data-st="${stage}" ${ed.ready.length ? '' : 'disabled'} title="Перепрогон документов, у которых алгоритмы с ошибками исправлены и выложены на сервер">${I.rerun}JSON с ошибками${ed.ready.length ? ` (${ed.ready.length})` : ''}</button>
          <button class="btn" data-act="dlPerf" data-login="${esc(login)}" data-st="${stage}" ${pd.ready.length ? '' : 'disabled'} title="Перепроверка документов, где выполнялись оптимизированные и уже выложенные алгоритмы">${I.rerun}JSON с оптимизированными${pd.ready.length ? ` (${pd.ready.length})` : ''}</button>
          <button class="btn small ghost" data-act="dlFull" data-login="${esc(login)}" data-st="${stage}" title="Все назначенные документы этапа">полный JSON</button>
          <button class="btn small ghost" data-act="dlCsv" data-login="${esc(login)}">таблица CSV</button>
        </div>
        <div class="why">${why}${pdWhy ? '<br>' + pdWhy : ''}</div>
      </div>
      <div class="card step">
        <div class="t"><span class="n">2</span>Запустите в ПиКТС 2.0</div>
        <div class="d">«Пакетное выполнение алгоритмов актуализации» → загрузите скачанный файл. Набор параметров уже указан в JSON${stage === 2 ? ' (для аналитических — свой набор у каждого документа)' : ''}:</div>
        <div class="copybox"><span style="flex:1">"paramValueSetCode": "BatchRun / код набора (у аналитических отчётов — свой, из «Все гуиды»)"</span></div>
        <div class="d" style="flex:0">Когда пакет закончится (или сервер упадёт) — сохраните протокол в .txt.</div>
      </div>
      <div class="card step">
        <div class="t"><span class="n">3</span>Загрузите протокол</div>
        <div class="d">Перетащите файл <b style="color:var(--text)">в любое место окна</b> или выберите вручную. Выполненное отметится само у владельца вида — даже если протокол загрузил кто-то другой.</div>
        <div class="acts">
          <button class="btn primary" data-act="pickFiles">${I.up16}Выбрать протоколы</button>
          ${mine && s.toReview ? `<button class="btn" data-act="startReview">${I.check}Проверить результаты (${s.toReview})</button>` : ''}
        </div>
      </div>
    </div>`;
  }

  function filterKinds(list, f) {
    const q = f.q.trim().toLowerCase();
    return list.filter(k => {
      if (f.status !== 'all') {
        if (f.status === 'issue') { if (k.reviewStatus !== 'issue') return false; }
        else if (f.status === 'reviewed') { if (k.reviewStatus !== 'ok') return false; }
        else if (f.status === 'unreviewed') { if (!isDone(k.status) || k.reviewStatus) return false; }
        else if (f.status === 'fixed') { if (k.fix !== 'deployed') return false; }
        else if (k.status !== f.status) return false;
      }
      if (f.type !== 'all') { if (f.type === 'analytic' ? k.category !== 'analytic' : (k.doctype !== f.type || k.category === 'analytic')) return false; }
      if (f.who && f.who !== 'all') { if (f.who === 'none' ? k.assignee : k.assignee !== f.who) return false; }
      if (q && !(k.code.toLowerCase().includes(q) || (k.name || '').toLowerCase().includes(q) || (k.guid || '').includes(q)
        || k.algorithms.some(a => a.toLowerCase().includes(q)) || k.docs2.some(d => d.guid.includes(q)))) return false;
      return true;
    });
  }

  function toolbar(page, list) {
    const f = S.f[page];
    const cnt = key => key === 'all' ? list.length
      : key === 'reviewed' ? list.filter(k => k.reviewStatus === 'ok').length
        : key === 'issue' ? list.filter(k => k.reviewStatus === 'issue').length
          : key === 'unreviewed' ? list.filter(k => isDone(k.status) && !k.reviewStatus).length
            : key === 'fixed' ? list.filter(k => k.fix === 'deployed').length
              : list.filter(k => k.status === key).length;
    const b = (key, label, col) => `<button class="${f.status === key ? 'on' : ''}" data-act="status" data-page="${page}" data-key="${key}">
      ${col ? `<span class="dot" style="background:${col}"></span>` : ''}${label}<span class="n">${cnt(key)}</span></button>`;
    return `<div class="toolbar">
      <div class="search">${I.search}<input class="input" id="q-${page}" data-act="q" data-page="${page}" placeholder="Код, наименование, GUID, алгоритм" value="${esc(f.q)}"><kbd class="hide-sm">/</kbd></div>
      <select class="input" data-act="type" data-page="${page}">
        <option value="all">Все типы</option>
        <option value="Passport" ${f.type === 'Passport' ? 'selected' : ''}>Паспорта</option>
        <option value="SummaryDocument" ${f.type === 'SummaryDocument' ? 'selected' : ''}>Сводные</option>
        <option value="analytic" ${f.type === 'analytic' ? 'selected' : ''}>Аналитические</option>
      </select>
      ${page === 'all' ? `<select class="input" data-act="who" data-page="all">
        <option value="all">Все исполнители</option>
        ${S.team.map(u => `<option value="${esc(u.login)}" ${f.who === u.login ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
        <option value="none" ${f.who === 'none' ? 'selected' : ''}>Без исполнителя</option>
      </select>` : ''}
    </div>
    <div class="seg" style="margin-bottom:12px">
      ${b('all', 'Все')}${b('pending', 'Не выполнялись', 'var(--pend)')}${list.some(k => k.status === 'partial') ? b('partial', 'Частично', 'var(--accent)') : ''}${b('interrupted', 'Прерваны', 'var(--int)')}${b('errors', 'С ошибками', 'var(--err)')}${b('server', 'Серверные проблемы', 'var(--srv)')}${b('ok', 'Выполнены', 'var(--ok)')}
      ${list.some(k => k.fix === 'deployed') ? b('fixed', 'Исправлены — перепрогнать', 'var(--rev)') : ''}
      ${b('unreviewed', 'Ждут проверки', 'var(--rev)')}${b('issue', 'Замечания', 'var(--issue)')}${b('reviewed', 'Проверены', 'var(--rev)')}
      ${list.some(k => k.status === 'noinstance') ? b('noinstance', 'Нет экземпляра', 'var(--noi)') : ''}
    </div>`;
  }

  function sortKinds(list, page) {
    const { key, dir } = S.sort[page];
    const v = k => {
      switch (key) {
        case 'status': return ORDER.indexOf(k.status) * 10 + (k.reviewStatus === 'issue' ? 0 : k.reviewStatus ? 2 : 1);
        case 'assignee': return k.assignee ? userName(k.assignee) : 'яя';
        case 'algCount': return k.progress ? k.progress.total : k.algCount;
        case 'lastRunAt': return ts(k.lastRunAt);
        case 'docSec': return k.docSec ?? -1;
        case 'errors': return k.errors;
        case 'review': return k.reviewStatus === 'issue' ? 0 : k.reviewStatus === 'ok' ? 2 : 1;
        case 'name': return (k.name || '').toLowerCase();
        case 'type': return k.doctype;
        default: return k.code;
      }
    };
    return list.slice().sort((a, b) => { const x = v(a), y = v(b); return x < y ? -dir : x > y ? dir : (a.code < b.code ? -1 : 1); });
  }

  // подпись под статусом: исправлено / оптимизировано / ждёт выкладки / обрыв
  function statusNote(k) {
    if (k.status === 'errors' || k.status === 'partial') {
      if (k.fix === 'deployed') return `<div class="sub-line" style="color:var(--rev)">исправлено — перепрогнать</div>`;
      if (k.fix === 'pending') return `<div class="sub-line" style="color:var(--int)">исправлено, ждёт выкладки</div>`;
    }
    if (k.perf === 'deployed') return `<div class="sub-line" style="color:var(--rev)">оптимизировано — перепроверить</div>`;
    if (k.running) return `<div class="sub-line" title="${esc(k.running)}">обрыв: ${esc(k.running.split(',')[0])}</div>`;
    return '';
  }

  function kindsTable(list, page) {
    const showWho = page === 'all';
    const bulk = page === 'all' && S.me.isAdmin;
    const stage = pageStage(page);
    const s = S.sort[page];
    const th = (key, label, cls = '') => `<th class="${cls}" data-act="sort" data-page="${page}" data-key="${key}">${label}${s.key === key ? `<span class="arr">${s.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
    const rows = sortKinds(list, page);
    S.nav = rows.map(k => k.code);
    if (!rows.length) return `<div class="card"><div class="empty"><div class="ico">🔎</div>Ничего не найдено — измените фильтр или поиск</div></div>`;
    const allSel = bulk && rows.every(k => S.selected.has(k.code));
    const mini = a => `<div class="mini-progress">${progressBar(a, true)}<span>${a.done}/${a.total}</span></div>`;
    return `<div class="card table-wrap"><table class="t">
      <thead><tr>
        ${bulk ? `<th class="nosort" style="width:36px"><input type="checkbox" data-act="selAll" ${allSel ? 'checked' : ''} title="Выбрать все показанные"></th>` : ''}
        ${th('status', 'Статус')}${th('code', 'Код вида')}${th('name', 'Наименование')}
        ${showWho ? th('assignee', 'Исполнитель') : ''}
        ${th('algCount', stage === 2 ? 'Док.' : 'Алг.', 'num')}${th('lastRunAt', 'Прогон')}${th('docSec', 'Время', 'num')}${th('errors', 'Ошибок', 'num')}${th('review', 'Проверка')}
      </tr></thead>
      <tbody>${rows.map(k => `<tr data-kind="${esc(k.code)}" class="${S.selected.has(k.code) ? 'sel' : ''}">
        ${bulk ? `<td data-stop="1"><input type="checkbox" data-act="sel" data-code="${esc(k.code)}" ${S.selected.has(k.code) ? 'checked' : ''}></td>` : ''}
        <td>${pill(k.status)}${stage === 2 ? mini(k.progress) : ''}${statusNote(k)}</td>
        <td class="code">${esc(k.code)}<div class="type">${typeRu(k.doctype, k.category)}</div></td>
        <td class="name"><div class="nm">${esc(k.name) || '<span class="faint">—</span>'}</div></td>
        ${showWho ? `<td>${who(k.assignee)}</td>` : ''}
        <td class="num muted">${stage === 2 ? k.progress.total : k.algCount}</td>
        <td class="nowrap muted" title="${k.lastRunAt ? fmtDT(k.lastRunAt, true) : ''}">${k.lastRunAt ? ago(k.lastRunAt) : '—'}</td>
        <td class="num">${k.docSec != null ? fmtSec(k.docSec) : '<span class="faint">—</span>'}</td>
        <td class="num">${k.errors ? `<span class="errn">${k.errors}</span>` : (k.status === 'ok' ? '<span class="faint">0</span>' : '<span class="faint">—</span>')}</td>
        <td>${k.reviewStatus === 'ok' ? `<span class="pill rev">${I.check}Проверено</span>` : k.reviewStatus === 'issue' ? `<span class="pill issue" title="${esc(k.reviewComment)}">${I.flag}Замечание</span>` : isDone(k.status) ? '<span class="pill plain">ждёт</span>' : '<span class="faint">—</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    ${bulk && S.selected.size ? `<div class="bulkbar">Выбрано: <b>${S.selected.size}</b>
      <span style="margin-left:8px">Назначить:</span>
      <select class="input" id="bulkTo">${S.team.map(u => `<option value="${esc(u.login)}">${esc(u.name)}</option>`).join('')}<option value="">— без исполнителя —</option></select>
      <button class="btn primary small" data-act="bulkAssign">Применить</button>
      <button class="btn small" data-act="bulkClear">Снять выбор</button></div>` : ''}`;
  }

  // =====================================================================================================================
  // страницы
  const myList = () => { const st = pageStage('my'); return viewKinds(st).filter(k => k.assignee === S.me.login); };

  function pageMy() {
    const stage = pageStage('my');
    const mine = myList();
    const s = stats(mine, stage);
    const lead = !s.total ? (stage === 2 ? 'Для ваших видов нет документов второго этапа.' : 'На вас пока ничего не назначено.')
      : s.remaining ? `Осталось выполнить <b style="color:var(--text)">${s.remaining}</b> из ${s.total} ${plural(s.total, 'документа', 'документов', 'документов')}${s.toReview ? `, ждут вашей проверки — <b style="color:var(--text)">${s.toReview}</b> ${plural(s.toReview, 'вид', 'вида', 'видов')}` : ''}.`
        : s.toReview ? `Все документы выполнены. Осталось проверить результаты — <b style="color:var(--text)">${s.toReview}</b> ${plural(s.toReview, 'вид', 'вида', 'видов')}.`
          : stage === 1 && hasStage2(S.me.login) ? 'Этап 1 выполнен полностью — открыт этап 2 🎉' : 'Всё выполнено и проверено. Отличная работа!';
    return `
      ${stageBar('my', S.me.login)}
      ${hero(s, 'my', `${esc(firstName(S.me.name))}, ваши виды`, lead, stage)}
      ${steps(S.me.login, s, stage)}
      ${toolbar('my', mine)}
      <div id="tbl">${kindsTable(filterKinds(mine, S.f.my), 'my')}</div>`;
  }

  const scopeAll = () => { const f = S.f.all; return viewKinds(f.stage).filter(k => f.who === 'all' || (f.who === 'none' ? !k.assignee : k.assignee === f.who)); };

  function pageAll() {
    const f = S.f.all;
    const scope = scopeAll();
    const s = stats(scope, f.stage);
    const title = f.who === 'all' ? 'Все виды' : f.who === 'none' ? 'Без исполнителя' : `Виды: ${esc(userName(f.who))}`;
    const lead = `${scope.length} ${plural(scope.length, 'вид', 'вида', 'видов')}${f.who === 'all' ? ` у ${S.team.length} человек` : ''} · выполнено ${s.done} из ${s.total} ${plural(s.total, 'документа', 'документов', 'документов')}`;
    return `
      ${stageBar('all')}
      ${hero(s, 'all', title, lead, f.stage)}
      ${f.who !== 'all' && f.who !== 'none' ? steps(f.who, s, f.stage) : ''}
      ${(() => {
        const pf = pendingFixedDocs(scope, f.stage);
        return `<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px">
          <button class="btn primary" data-act="dlAllPendFix" data-st="${f.stage}" ${pf.all.length ? '' : 'disabled'}
            title="Документы, которые ещё не выполнялись, и документы с ошибками, исправление которых уже выложено на сервер, а последний прогон шёл меньше 5 минут">${I.dl}JSON: не выполнялись + исправленные (${pf.all.length})</button>
          <span class="muted">не выполнялись: ${pf.pending.length} · с ошибками, исправлены и выложены, прогон &lt; 5 мин: ${pf.fixed.length}</span>
        </div>`;
      })()}
      ${toolbar('all', scope)}
      <div id="tbl">${kindsTable(filterKinds(viewKinds(f.stage), f), 'all')}</div>`;
  }

  function teamChart() {
    // накопленное число выполненных видов по людям во времени
    const pts = S.kinds.filter(k => k.firstDoneAt && k.assignee).map(k => ({ t: ts(k.firstDoneAt), who: k.assignee })).sort((a, b) => a.t - b.t);
    if (pts.length < 2) return '<div class="empty"><div class="ico">📈</div>График появится после загрузки протоколов</div>';
    const W = 760, H = 240, L = 36, R = 12, T = 12, B = 26;
    const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 60000);
    const maxY = Math.max(...S.team.map(u => S.kinds.filter(k => k.assignee === u.login && k.status !== 'noinstance').length), 1);
    const x = t => L + ((t - t0) / (t1 - t0)) * (W - L - R);
    const y = v => T + (1 - v / maxY) * (H - T - B);
    const lines = S.team.map(u => {
      let c = 0;
      const p = [[x(t0), y(0)]];
      pts.filter(q => q.who === u.login).forEach(q => { p.push([x(q.t), y(c)]); c++; p.push([x(q.t), y(c)]); });
      p.push([x(t1), y(c)]);
      return `<polyline fill="none" stroke="${color(u.login)}" stroke-width="2.4" stroke-linejoin="round" points="${p.map(a => a.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
    }).join('');
    const ticks = [0, .25, .5, .75, 1].map(f => Math.round(f * maxY));
    const grid = [...new Set(ticks)].map(v => `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('');
    const xt = [0, .5, 1].map(f => { const t = t0 + f * (t1 - t0); return `<text x="${x(t)}" y="${H - 6}" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}">${fmtDT(t)}</text>`; }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${xt}${lines}</svg>
      <div class="legend">${S.team.map(u => `<span><i class="sw" style="background:${color(u.login)}"></i>${esc(u.name)}</span>`).join('')}</div>`;
  }

  function pageTeam() {
    const total = stats(S.kinds, 1);
    const cards = S.team.map(u => {
      const s = stats(S.kinds.filter(k => k.assignee === u.login), 1);
      const open2 = stage2Open(u.login) && hasStage2(u.login);
      const s2 = open2 ? stats(viewKinds(2).filter(k => k.assignee === u.login), 2) : null;
      return `<div class="card person" data-act="person" data-login="${esc(u.login)}" title="Открыть виды: ${esc(u.name)}">
        <div class="top">${avatar(u.login, u.name)}<div><div class="nm">${esc(u.name)}</div><div class="rl">${roleRu(u.role)} · ${s.total} ${plural(s.total, 'вид', 'вида', 'видов')}</div></div>
          <div class="pct"><b>${s.pct}%</b><div class="muted" style="font-size:11.5px">этап 1</div></div></div>
        ${progressBar(s)}
        <div class="stats">
          <div><div class="v" style="color:var(--ok)">${s.ok}</div><div class="l">выполнено</div></div>
          <div><div class="v" style="color:var(--err)">${s.errors}</div><div class="l">с ошибками</div></div>
          <div><div class="v" style="color:var(--int)">${s.interrupted}</div><div class="l">прервано</div></div>
          <div><div class="v">${s.pending}</div><div class="l">осталось</div></div>
        </div>
        ${s2 ? `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span class="stage-chip">этап 2</span><span class="muted"><b style="color:var(--text)">${s2.done}</b> из ${s2.total} · ${s2.pct}%</span></div>${progressBar(s2, true)}</div>` : ''}
        <div class="foot"><span>Проверено <b>${s.reviewed}</b>${s.issues ? ` · замечаний <b style="color:var(--issue)">${s.issues}</b>` : ''}</span>
          <span>≈ <b>${s.eta != null && s.remaining ? fmtSec(s.eta) : s.remaining ? '—' : s2 && s2.remaining ? fmtSec(s2.eta) : 'готово'}</b></span></div>
      </div>`;
    }).join('');
    return `
      ${hero(total, 'all', 'Команда', `${S.team.length} человек · ${total.total} документов к проверке на этапе 1 · выполнено ${total.done}`)}
      <div class="team section-gap">${cards}</div>
      <div class="two">
        <div class="card card-pad"><h3>Динамика: выполнено видов</h3>${teamChart()}</div>
        <div class="card card-pad"><h3>Лента событий</h3><div class="feed" id="feed">${'<div class="skel" style="margin:10px 0"></div>'.repeat(5)}</div></div>
      </div>`;
  }

  async function loadEvents() {
    const ev = await safe(() => DB.events(200));
    const el = $('#feed');
    if (!el || !ev) return;
    el.innerHTML = ev.length ? ev.map(e => `<div class="ev">${S.users.some(u => u.login === e.by) ? avatar(e.by) : '<span class="avatar" style="background:var(--faint)">•</span>'}
        <div><b>${esc(userName(e.by))}</b> ${esc(e.text)}${e.kind ? ` · <a href="#/team/k/${encodeURIComponent(e.kind)}">${esc(e.kind)}</a>` : ''}
        <div class="when">${ago(e.at)}</div></div></div>`).join('') : '<div class="empty">Пока пусто</div>';
  }

  const kindByCode = code => S.kinds.find(k => k.code === code);
  function uploadStats(id) {
    const rs = S.runs.filter(r => r.uploadId === id);
    const owners = {};
    rs.filter(r => r.kindCode).forEach(r => { const k = kindByCode(r.kindCode); const o = (k && k.assignee) || ''; owners[o] = (owners[o] || 0) + 1; });
    return {
      docs: rs.length,
      finished: rs.filter(r => r.finished && r.kindCode).length,
      withErrors: rs.filter(r => r.finished && r.kindCode && effErrors(r).eff).length,
      interrupted: rs.filter(r => !r.finished && r.kindCode).length,
      unknown: rs.filter(r => r.guid && !r.kindCode).length,
      unattributed: rs.filter(r => !r.guid && !r.kindCode).length,
      owners,
    };
  }
  const ownersLine = owners => Object.keys(owners).length ? `<div class="owners">${Object.entries(owners).sort((a, b) => b[1] - a[1])
    .map(([o, n]) => o ? `<span>${who(o)} <b>${n}</b></span>` : `<span class="faint">без исполнителя ${n}</span>`).join('')}</div>` : '';

      <div class="card card-pad" style="margin-bottom:16px">
        <div class="drop" data-drop="">

        <tbody>${list.map(u => {

          return `<tr data-upload="${u.id}">
          <td class="muted">${u.id}</td>

          <td>${who(u.by)}<div class="sub-line">${ago(u.at)}</div></td>

            <div style="width:${(c.interrupted / t) * 100}%;background:var(--int)"></div>

            <div class="sub-line">${c.docs} ${plural(c.docs, 'документ', 'документа', 'документов')}${c.unattributed ? ` · <span style="color:var(--int)">вид не определён: ${c.unattributed}</span>` : ''}</div>
            ${ownersLine(c.owners)}</td>
          <td class="num" style="color:var(--ok);font-weight:700">${c.finished}</td>
          <td class="num">${c.withErrors ? `<span class="errn">${c.withErrors}</span>` : '<span class="faint">0</span>'}</td>
          <td class="num">${c.interrupted ? `<span style="color:var(--int);font-weight:700">${c.interrupted}</span>` : '<span class="faint">0</span>'}</td>
          <td class="num muted">${c.unknown}</td>
          <td class="nowrap" data-stop="1">

            ${(S.me.isAdmin || u.by === S.me.login) ? `<button class="btn small ghost danger" data-act="delUpload" data-id="${u.id}" title="Удалить протокол и его отметки">${I.x}</button>` : ''}

  }

  // =====================================================================================================================
  // алгоритмы: время, ошибки, медленные, «не трогать», версии и выкладка на сервер
  function pageAlgs() {
    return `
      <div class="page-title"><h1>Алгоритмы</h1><span class="sub">время и ошибки — по последнему завершённому прогону каждого документа · нажмите на строку — увидите виды</span></div>
      <div id="deployBox">${deployBox()}</div>
      <div class="toolbar"><div class="search">${I.search}<input class="input" id="q-algs" data-act="aq" placeholder="Алгоритм" value="${esc(S.f.algs.q)}"><kbd class="hide-sm">/</kbd></div>
        <div class="seg" id="algModes"></div>
        <span class="muted" id="algSum"></span></div>
      <div id="algs"><div class="card card-pad">${'<div class="skel" style="margin:12px 0"></div>'.repeat(6)}</div></div>`;
  }

  function deployBox() {
    const pend = S.pendingVers;
    const last = S.deploys[0];
    const lastLine = last ? `Последняя выкладка: <b>${fmtDT(last.at, true)}</b> · ${esc(userName(last.by))} · ${last.algCount} ${plural(last.algCount, 'алгоритм', 'алгоритма', 'алгоритмов')}${last.note ? ' · ' + esc(last.note) : ''}` : 'Выкладок ещё не было.';
    // откат: в последнем протоколе версия ниже, чем уже видели раньше (залит старый пакет или не все файлы)
    const откаты = [...S.observed.entries()].filter(([, o]) => o.max > o.last);
    const rollbackBox = откаты.length ? `<div class="card deploy-card" style="border-color:color-mix(in srgb,var(--err) 40%,var(--border));background:linear-gradient(135deg,var(--err-soft),var(--surface) 70%)">
      <div class="txt"><b>⚠ На сервере версии ниже, чем уже были: ${откаты.length} ${plural(откаты.length, 'алгоритм', 'алгоритма', 'алгоритмов')}</b>
        <div class="muted" style="margin-top:4px;font-size:13px">По меткам [PKTS-VER] в последних протоколах. Похоже, залит старый пакет или не все файлы — проверьте выкладку.</div>
        <details><summary>Какие</summary><div class="vlist">${откаты.map(([n, o]) => `<div><span class="mono">${esc(n)}</span> — сейчас ${verLabel(o.last)} (${fmtDT(o.at)}), раньше было ${verLabel(o.max)}</div>`).join('')}</div></details></div></div>` : '';
    if (!pend.length) {
      return rollbackBox + `<div class="card deploy-card calm"><div class="txt"><span class="muted">${I.server}</span> Все исправленные алгоритмы уже на сервере. ${lastLine}
        ${S.deploys.length ? ` · <a href="#" data-act="deployHistory">история (${S.deploys.length})</a>` : ''}</div></div>`;
    }
    const names = [...new Set(pend.map(v => v.name))];
    return rollbackBox + `<div class="card deploy-card">
      <div class="txt"><b>${I.server} Обновлено ${names.length} ${plural(names.length, 'алгоритм', 'алгоритма', 'алгоритмов')} — на сервере их ещё нет</b>
        <div class="muted" style="margin-top:4px;font-size:13px">Залейте пакет на сервер ПиКТС и нажмите кнопку. Сайт и сам видит выкладку по меткам версий в протоколах ([PKTS-VER]): как только алгоритм отработает в новой версии — он считается выложенным. Кнопка нужна для алгоритмов, которые ещё не запускались.</div>
        <details><summary>Что обновлено</summary><div class="vlist">${pend.map(v => { const o = onServer(v.name); return `<div><span class="mono">${esc(v.name)}</span> <span class="faint">${verLabel(v.version)}${v.at ? ' · ' + fmtDT(v.at) : ''} · на сервере ${o ? verLabel(o.last) : 'метки ещё нет'}</span>${v.note ? ` — ${esc(v.note)}` : ''}</div>`; }).join('')}</div></details>
        <div class="why">${lastLine}${S.deploys.length ? ` · <a href="#" data-act="deployHistory">история</a>` : ''}</div></div>
      <div class="act">${isDev()
        ? `<input class="input" id="deployNote" placeholder="Комментарий (необязательно)" style="width:220px"><button class="btn primary" data-act="deploy">${I.check}Залил на сервер</button>`
        : '<span class="muted" style="font-size:13px">Подтверждает выкладку разработчик.</span>'}</div>
    </div>`;
  }

  async function loadAlgs() {
    if (!S.algs) {
      const ids = [...new Set(S.kinds.flatMap(k => [k.s1.fin && k.s1.fin.id, ...k.docs2.map(d => d.st.fin && d.st.fin.id)]).filter(Boolean))];
      const rows = [];
      for (let i = 0; i < ids.length; i += 1000) {
        const part = await safe(() => DB.runsAlgs(ids.slice(i, i + 1000)));
        if (!part) return;
        rows.push(...part);
      }
      const startOf = new Map(S.runs.map(r => [r.id, ts(r.startAt)]));
      const acc = new Map();
      const get = name => { let x = acc.get(name); if (!x) acc.set(name, x = { name, docs: 0, count: 0, totalSec: 0, maxSec: 0, failed: 0, kinds: new Set(), lastSec: null, lastAt: 0 }); return x; };
      for (const r of rows) for (const a of (r.algs || [])) {
        const x = get(a.name);
        x.docs++; x.count += a.count; x.totalSec += a.totalSec; x.maxSec = Math.max(x.maxSec, a.maxSec); if (a.failed) x.failed++;
        x.kinds.add(r.kindCode);
        const t = startOf.get(r.id) || 0;   // время в последнем по времени прогоне
        if (t >= x.lastAt) { x.lastAt = t; x.lastSec = a.totalSec; }
      }
      S.versions.forEach((vs, name) => get(name));   // исправленные, даже если ещё не запускались
      S.algs = [...acc.values()].map(x => ({ ...x, kinds: [...x.kinds], avgSec: x.count ? x.totalSec / x.count : 0, lastSec: x.lastSec ?? -1 }));
    }
    renderAlgs();
  }

  function algMode(a) {
    const v = verInfo(a.name);
    return { ign: ignored(a.name), failed: a.failed > 0, slow: a.maxSec >= SLOW_SEC, pending: !!(v && v.pending), deployed: !!(v && !v.pending && v.last && v.last.version > 1), behind: !!(v && v.behind), rollback: !!(v && v.rollback), v };
  }

  function renderAlgs() {
    const el = $('#algs');
    if (!el || !S.algs) return;
    S.algSel = S.algSel || new Set();
    const q = S.f.algs.q.trim().toLowerCase();
    const mode = S.f.algs.mode;
    const s = S.sort.algs;
    const withMode = S.algs.map(a => ({ a, m: algMode(a) }));
    const counts = { all: withMode.length, failed: 0, slow: 0, ignored: 0, pending: 0, deployed: 0, behind: 0 };
    withMode.forEach(({ m }) => { if (m.failed) counts.failed++; if (m.slow) counts.slow++; if (m.ign) counts.ignored++; if (m.pending) counts.pending++; if (m.deployed) counts.deployed++; if (m.behind || m.rollback) counts.behind++; });
    const mb = (key, label, col) => `<button class="${mode === key ? 'on' : ''}" data-act="amode" data-key="${key}">${col ? `<span class="dot" style="background:${col}"></span>` : ''}${label}<span class="n">${counts[key]}</span></button>`;
    $('#algModes').innerHTML = mb('all', 'Все') + mb('failed', 'С ошибками', 'var(--err)') + mb('slow', 'Медленные (≥ 5 мин)', 'var(--int)')
      + mb('ignored', 'Не трогать', 'var(--faint)') + mb('pending', 'Ждут выкладки', 'var(--int)') + mb('deployed', 'Исправлены', 'var(--rev)')
      + (counts.behind ? mb('behind', 'На сервере старая версия', 'var(--err)') : '');
    const list = withMode.filter(({ a, m }) => (!q || a.name.toLowerCase().includes(q))
      && (mode === 'all' || (mode === 'failed' && m.failed) || (mode === 'slow' && m.slow) || (mode === 'ignored' && m.ign) || (mode === 'pending' && m.pending) || (mode === 'deployed' && m.deployed) || (mode === 'behind' && (m.behind || m.rollback))))
      .sort((x, y) => (x.a[s.key] < y.a[s.key] ? -1 : x.a[s.key] > y.a[s.key] ? 1 : 0) * s.dir);
    const max = Math.max(1, ...S.algs.map(a => a.maxSec));
    const tot = S.algs.reduce((x, a) => x + a.totalSec, 0);
    $('#algSum').textContent = S.algs.length ? `${S.algs.length} алгоритмов · суммарно ${fmtSec(tot)}` : '';
    if (!S.algs.length) { el.innerHTML = '<div class="card"><div class="empty"><div class="ico">⏱️</div>Данных пока нет — загрузите протоколы</div></div>'; return; }
    if (!list.length) { el.innerHTML = '<div class="card"><div class="empty"><div class="ico">🔎</div>Ничего не найдено</div></div>'; return; }
    const th = (key, label, cls = '') => `<th class="${cls}" data-act="asort" data-key="${key}">${label}${s.key === key ? `<span class="arr">${s.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
    const dev = isDev();
    const shown = list.slice(0, 800);
    const allSel = dev && shown.every(({ a }) => S.algSel.has(a.name));
    // «На сервере» — версия по последнему протоколу с меткой [PKTS-VER]; «Доступна» — последняя версия в st5
    const serverCell = m => {
      const o = m.v && m.v.observed;
      if (!o) return '<span class="faint" title="в загруженных протоколах ещё нет метки версии">—</span>';
      return `<span class="mono" title="по протоколу от ${fmtDT(o.at, true)}${o.max > o.last ? ' · раньше было ' + verLabel(o.max) : ''}">${verLabel(o.last)}</span>`
        + (m.rollback ? ' <span class="pill errors small" title="раньше на сервере была версия выше">откат</span>' : '');
    };
    const availCell = m => !m.v ? '<span class="faint">0.1</span>'
      : m.v.pending ? `<span class="pill fixp small" title="${esc(m.v.notes)}">${verLabel(m.v.available)} · ${m.v.last && m.v.last.kind === 'perf' ? 'оптимизация' : 'исправление'}, ждёт выкладки</span>`
        : m.v.available > 1 ? `<span class="pill fixd small" title="${esc(m.v.notes)}">${verLabel(m.v.available)} · ${m.v.last && m.v.last.kind === 'perf' ? 'оптимизирован' : 'исправлен'}</span>`
          : '<span class="faint">0.1</span>';
    const flagTitle = name => { const f = S.flags.get(name); return f ? esc(`Не трогать — ${userName(f.by)}, ${fmtDT(f.at)}${f.note ? ': ' + f.note : ''}`) : ''; };
    el.innerHTML = `<div class="card table-wrap"><table class="t"><thead><tr>
      ${dev ? `<th class="nosort" style="width:36px"><input type="checkbox" data-act="aselAll" ${allSel ? 'checked' : ''} title="Выбрать все показанные"></th>` : ''}
      ${th('name', 'Алгоритм')}${th('docs', 'Док.', 'num')}${th('lastSec', 'Последний', 'num')}${th('avgSec', 'Среднее', 'num')}
      ${th('maxSec', 'Максимум', 'num')}<th class="nosort" style="width:120px"></th>${th('totalSec', 'Всего', 'num')}${th('failed', 'С ошибкой', 'num')}
      <th class="nosort" title="версия по последнему протоколу (метка [PKTS-VER])">На сервере</th><th class="nosort" title="последняя версия в st5">Доступна</th></tr></thead>
      <tbody>${shown.map(({ a, m }) => `<tr data-alg="${esc(a.name)}" class="${S.algSel.has(a.name) ? 'sel' : ''}">
        ${dev ? `<td data-stop="1"><input type="checkbox" data-act="asel" data-name="${esc(a.name)}" ${S.algSel.has(a.name) ? 'checked' : ''}></td>` : ''}
        <td class="mono">${esc(a.name)}${S.links && S.links.has(a.name.toLowerCase()) ? ' <span class="faint">(связи)</span>' : ''}
          ${m.slow ? ' <span class="pill fixp small" title="Дольше 5 минут — кандидат на оптимизацию">медленный</span>' : ''}${m.ign ? ` <span class="pill ign small" title="${flagTitle(a.name)}">${I.mute} не трогать</span>` : ''}</td>
        <td class="num">${a.docs}</td>
        <td class="num">${a.lastSec >= 0 ? fmtSec(a.lastSec) : '<span class="faint">—</span>'}</td>
        <td class="num">${fmtSec(a.avgSec)}</td><td class="num"><b style="${m.slow ? 'color:var(--int)' : ''}">${fmtSec(a.maxSec)}</b></td>
        <td><div class="alg-bar ${a.failed ? 'f' : ''}" style="width:${Math.max(1, (a.maxSec / max) * 100)}%"></div></td>
        <td class="num">${fmtSec(a.totalSec)}</td>
        <td class="num">${a.failed ? `<span class="errn">${a.failed}</span>` : '<span class="faint">0</span>'}</td>
        <td class="nowrap">${serverCell(m)}</td><td class="nowrap">${availCell(m)}</td></tr>`).join('')}</tbody></table></div>
      ${dev && S.algSel.size ? `<div class="bulkbar">Выбрано: <b>${S.algSel.size}</b>
        <button class="btn primary small" data-act="aflag" data-on="1">${I.mute} Не трогать</button>
        <button class="btn small" data-act="aflag" data-on="0">Снять «не трогать»</button>
        <button class="btn small" data-act="aselClear">Снять выбор</button>
        <span style="opacity:.75;font-size:12.5px">отметка для разработчика: статусы не меняются, в выгрузку ошибок и медленных такие алгоритмы не попадают</span></div>` : ''}`;
  }

  // =====================================================================================================================
  // карточка вида
  function closeDrawer(silent) {
    const ov = $('#overlay');
    if (ov) ov.innerHTML = '';
    if (!silent && S.kindOpen) { S.kindOpen = null; go(S.route); }
  }

  async function openKind(code) {
    const ov = $('#overlay');
    if (!ov) return;
    const k = kindByCode(code);
    if (!k) { toast('Вид ' + code + ' не найден', true); return; }
    if (!ov.querySelector('.drawer')) {
      ov.innerHTML = `<div class="backdrop" data-act="closeDrawer"></div><aside class="drawer"><div class="drawer-body">${'<div class="skel" style="margin:14px 0"></div>'.repeat(8)}</div></aside>`;
    }
    const runs = await safe(() => DB.runsFull({ kindCode: code }));
    if (!runs || S.kindOpen !== code) return;
    S.cur = { k, runs };
    renderDrawer();
  }

  // ошибка с пометками: «не трогать», исправлено и выложено / ждёт выкладки
  // серверная ли ошибка прогона (по srv_problems прогона: тот же алгоритм и текст)
  function isSrvErr(e, run) {
    const l = (run && run.srvProblems) || [];
    return l.some(p => p.kind === 'error' && (p.alg || '') === (e.alg || '') && String(e.message || '').startsWith(p.text.slice(0, 120)));
  }
  function srvBlock(run) {
    const l = (run && run.srvProblems) || [];
    if (!l.length) return '';
    return `<div class="srvbox"><div class="a">${I.flag}Серверные проблемы · ${l.length}<span class="faint" style="font-weight:500"> — не ошибки алгоритмов: параметры, проверка данных, подписанты, обрыв соединения</span></div>
      ${l.map(p => `<div class="srv-line"><span class="pill small ${p.kind === 'warn' ? 'plain' : 'srvp'}">${p.kind === 'warn' ? 'предупреждение' : 'ошибка'}</span>${p.alg ? `<b>${esc(p.alg)}</b>: ` : ''}${esc(p.text)}</div>`).join('')}</div>`;
  }
  function errBox(e, run) {
    const ign = ignored(e.alg);
    const fx = e.alg && !ign ? algFix(e.alg, run) : null;
    const rv = e.alg && run && run.algVers ? run.algVers[e.alg] : null;
    const tags = (rv ? `<span class="pill plain small" title="версия алгоритма в этом прогоне (метка [PKTS-VER])">версия ${esc(rv)}</span>` : '')
      + (ign ? '<span class="pill ign small">не трогать</span>' : '')
      + (fx === 'deployed' ? '<span class="pill fixd small">исправлено — перепрогнать</span>' : fx === 'pending' ? '<span class="pill fixp small">исправлено, ждёт выкладки</span>' : '');
    return `<div class="errbox ${ign ? 'ign' : ''}"><div class="a">${esc(e.alg || 'Документ')}${tags ? `<span class="tags">${tags}</span>` : ''}</div><div style="margin-top:3px">${esc(e.message)}</div>
      ${e.details ? `<details><summary>Подробности и стек</summary><pre>${esc(e.details)}</pre></details>` : ''}</div>`;
  }

  function renderDrawer() {
    const ov = $('#overlay');
    if (!ov || !S.cur) return;
    const { runs } = S.cur;
    const k = kindByCode(S.cur.k.code) || S.cur.k;
    const stage = curStage() === 2 && k.docs2.length ? 2 : 1;
    const v = viewOf(k, stage);
    const up = new Map(S.uploadsList.map(u => [u.id, u]));
    const full = new Map(runs.map(r => [r.id, r]));
    runs.sort((a, b) => ts(b.startAt) - ts(a.startAt) || b.uploadId - a.uploadId || b.id - a.id);
    // документы вида: этап 1 + этап 2
    const docs = [];
    if (k.guid || k.s1.last) docs.push({ stage: 1, guid: k.guid, ps: k.ps || '', st: k.s1 });
    k.docs2.forEach(d => docs.push({ stage: 2, guid: d.guid, ps: d.ps, st: d.st }));
    const finOf = d => d.st.fin ? full.get(d.st.fin.id) || d.st.fin : null;
    const lastFin = finOf(docs[0] || { st: k.s1 });
    const last = k.s1.last ? full.get(k.s1.last.id) || k.s1.last : null;
    const errs1 = ((lastFin || last || {}).errors) || [];
    const errDocs = docs.filter(d => d.st.fin && ((finOf(d).errors || []).length || (finOf(d).srvProblems || []).length));
    const errTotal = docs.reduce((a, d) => a + d.st.errors, 0);
    const algRun = lastFin || (errDocs[0] && finOf(errDocs[0])) || null;
    const algMap = new Map(((algRun && algRun.algs) || []).map(a => [a.name.toLowerCase(), a]));
    const own = k.algorithms.concat((k.linkAlgs || []).filter(a => !k.algorithms.some(b => b.toLowerCase() === a.toLowerCase())));
    const inKind = new Set(own.map(a => a.toLowerCase()));
    const algs = own.map(a => { const x = algMap.get(a.toLowerCase()); return x ? { ...x, name: a, inKind: true, ran: true } : { name: a, inKind: true, ran: false, count: 0, totalSec: 0, maxSec: 0, failed: false }; })
      .concat([...algMap.values()].filter(x => !inKind.has(x.name.toLowerCase())).map(x => ({ ...x, inKind: false, ran: true })))
      .sort((a, b) => b.totalSec - a.totalSec || (a.name < b.name ? -1 : 1));
    const maxAlg = Math.max(0.001, ...algs.map(a => a.totalSec));
    const notRan = algs.filter(a => a.inKind && !a.ran && !LogParser.isLink(S.links, a.name)).length;
    const pos = S.nav.indexOf(k.code);
    const tab = S.tab;
    const tb = (id, label, n, err) => `<button class="${tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}">${label}${n != null ? `<span class="n ${err && n ? 'err' : ''}">${n}</span>` : ''}</button>`;

    const rv = stage === 2 ? { st: k.review2Status, c: k.review2Comment, by: k.review2By, at: k.review2At } : { st: k.reviewStatus, c: k.reviewComment, by: k.reviewBy, at: k.reviewAt };
    let body = '';
    if (tab === 'overview') {

      body = `
        <div class="review-box">

          ${rv.by ? `<div class="faint" style="font-size:12px;margin-top:6px">Отметил(а): ${esc(userName(rv.by))}, ${fmtDT(rv.at, true)}</div>` : ''}
        </div>
        ${stage === 2 ? `<div class="section"><h4>Этап 2 · ${a.total} ${plural(a.total, 'документ', 'документа', 'документов')}</h4>
          <div class="meta-grid">
            <div class="mg"><div class="l">Выполнено</div><div class="v" style="color:var(--ok)">${a.done} из ${a.total}</div></div>
            <div class="mg"><div class="l">С ошибками</div><div class="v" style="color:${a.errors ? 'var(--err)' : 'inherit'}">${a.errors}</div></div>
            <div class="mg"><div class="l">Прервано / не выполнялось</div><div class="v">${a.interrupted} / ${a.pending}</div></div>

          </div>
          <div style="margin-top:10px">${progressBar(a)}</div>
          <button class="btn small" style="margin-top:12px" data-act="tab" data-tab="docs">Все документы этапа</button></div>` : ''}
        <div class="section"><h4>Последний прогон${k.docs2.length ? ' (этап 1)' : ''}</h4>
          ${last ? `<div class="meta-grid">
            <div class="mg"><div class="l">Когда</div><div class="v">${fmtDT(last.startAt, true)}</div></div>
            <div class="mg"><div class="l">Время документа</div><div class="v">${fmtSec(docSec(lastFin || last))}</div></div>
            <div class="mg"><div class="l">Ошибок</div><div class="v" style="color:${k.errors ? 'var(--err)' : 'inherit'}">${k.errors}${k.ignored ? ` <span class="faint" style="font-weight:500">из них ${k.ignored} в «не трогать»</span>` : ''}</div></div>
            <div class="mg"><div class="l">Алгоритмов отработало</div><div class="v">${algs.filter(x => x.ran).length} из ${own.length}${notRan && lastFin ? ` <span class="faint" style="font-weight:500">(не запускались ${notRan})</span>` : ''}</div></div>

          ${errs1.length ? `<div class="section"><h4>Ошибки</h4>${errs1.slice(0, 3).map(e => errBox(e, lastFin || last)).join('')}${errs1.length > 3 || errDocs.length > 1 ? `<button class="btn small" data-act="tab" data-tab="errors">Все ошибки (${errTotal})</button>` : ''}</div>` : ''}`
        : `<div class="empty" style="padding:24px"><div class="ico">⏳</div>Протоколов по этому виду ещё не загружали</div>`}
        </div>
        <div class="section"><h4>Протокол одиночного запуска</h4>
          <div class="drop" data-drop="${esc(k.code)}" style="padding:14px">
            <b>Перетащите сюда протокол запуска этого документа</b>
            <div class="muted" style="font-size:12.5px">он будет отнесён к ${esc(k.code)} — даже если в нём нет GUID</div>
